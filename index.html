<!doctype html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tokyo Trip">
<meta name="theme-color" id="themeColor" content="#f3f4f7">
<title>Tokyo–Kamakura Trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: one-screen phone app — header (days) / scrolling view / bottom tab bar. Map view fills the middle. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --sunk:#e9ebf1; --ink:#161b2a; --muted:#5d6579; --line:#d9dce5;
  --accent:#2c4aa0; --accent-ink:#ffffff; --accent-soft:#e3e8f7;
  --c-food:#d2541b; --c-shop:#8a3cb0; --c-sight:#c3272b; --c-station:#1f6fbf; --c-other:#5b6478;
  --ok:#2f8a4f; --warn:#b7791f; --bad:#c3272b;
  --f-body:"IBM Plex Sans Thai","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-jp:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11151f; --surface:#1a2030; --sunk:#232a3c; --ink:#e9ecf4; --muted:#9aa3b8; --line:#2d3549;
  --accent:#8fa8f0; --accent-ink:#10162a; --accent-soft:#25304d;
  --c-food:#f08a52; --c-shop:#c58ae6; --c-sight:#f06a6a; --c-station:#69aef0; --c-other:#9aa3b8;
  --ok:#5cc184; --warn:#e2b04f; --bad:#f06a6a; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#11151f; --surface:#1a2030; --sunk:#232a3c; --ink:#e9ecf4; --muted:#9aa3b8; --line:#2d3549;
  --accent:#8fa8f0; --accent-ink:#10162a; --accent-soft:#25304d;
  --c-food:#f08a52; --c-shop:#c58ae6; --c-sight:#f06a6a; --c-station:#69aef0; --c-other:#9aa3b8;
  --ok:#5cc184; --warn:#e2b04f; --bad:#f06a6a; color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%} /* ปิดดับเบิลแทปซูม */
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.jp{font-family:var(--f-jp);color:var(--muted);font-size:12px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* Header */
header{background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex:none;z-index:5}
.top{display:flex;align-items:center;gap:8px;padding-block:10px 6px}
.iconbtn{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;padding:0}
.iconbtn svg{width:17px;height:17px;stroke:var(--ink);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.brand{font-weight:700;letter-spacing:.02em;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:430px){ .brand small{display:none} }
.brand small{font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}
button.brand{border:0;background:none;padding:0;text-align:left;color:var(--ink)}
.brand .caret{font-size:11px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:12px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.days{display:flex;gap:6px;overflow-x:auto;padding-block:4px 10px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.daybtn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;text-align:left;line-height:1.25}
.daybtn b{display:block;font-size:13px}
.daybtn span{font-size:11px;color:var(--muted)}
.daybtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.daybtn[aria-pressed="true"] span{color:inherit;opacity:.85}
.daybtn .today{display:inline-block;margin-left:4px;font-size:10px;padding:0 5px;border-radius:4px;background:var(--ok);color:#fff}

/* Main */
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 24px;display:flex;flex-direction:column;gap:14px;max-width:720px;margin:0 auto}
h2{font-size:18px;margin:0;text-wrap:balance;line-height:1.3}
h3{font-size:14px;margin:0;letter-spacing:.02em}
.sub{color:var(--muted);font-size:13px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Bottom nav */
nav.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
.tab{border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent);font-weight:600}

/* Map */
#map,#gmap{position:absolute;inset:0;background:var(--sunk)}
.gm-style .gm-style-iw-c{background:var(--surface)!important;color:var(--ink);padding:0!important}
.gm-style .gm-style-iw-d{overflow:auto!important;padding:12px 14px 2px!important}
.gm-style .gm-style-iw-tc::after{background:var(--surface)!important}
.gm-style .gm-ui-hover-effect>span{background-color:var(--muted)!important}
.gm-style .pop{font:13px/1.45 var(--f-body);min-width:200px;max-width:260px}
.livebadge{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.livebadge.open{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.livebadge.closed{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.map-tools{position:absolute;z-index:500;top:10px;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;pointer-events:none}
.map-tools>*{pointer-events:auto}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chip[aria-pressed="false"]{opacity:.5}
.msr{width:13px;height:13px;fill:#fff;display:block}
.chip i.gi{background:var(--gc)}
.pitem .ic.gi{background:var(--gc)} .pitem .ic.gi .msr{width:17px;height:17px}
.gmask{display:block;width:16px;height:16px;background:#fff;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.chip i{font-style:normal;font-family:var(--f-jp);font-size:11px;width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;color:#fff}
.map-zones{position:absolute;z-index:500;bottom:12px;left:max(10px,env(safe-area-inset-left,0px));display:flex;gap:6px;flex-wrap:wrap;max-width:70%}
.route-panel{position:absolute;z-index:600;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.15);
  padding:12px max(14px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;max-height:55%;overflow-y:auto}
.route-panel .rp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.route-panel .rp-big{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.route-panel .rp-next{background:var(--accent-soft);border-radius:10px;padding:8px 10px;font-weight:600}
.route-panel .rp-next small{display:block;font-weight:400;color:var(--muted)}
.route-panel ol{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.route-panel ol li.cur{font-weight:700}
#v-map.routing .map-zones{display:none}
.pin-dest{width:18px;height:18px;border-radius:50%;background:#e5484d;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.fab{position:absolute;z-index:500;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.fab svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:2}
.map-off{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);padding:24px;text-align:center}
.pin{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 12px/1 var(--f-jp);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin-f{background:var(--c-food)} .pin-s{background:var(--c-shop)} .pin-h{background:var(--c-sight)} .pin-t{background:var(--c-station)} .pin-o{background:var(--c-other)}
.bg-f{background:var(--c-food)} .bg-s{background:var(--c-shop)} .bg-h{background:var(--c-sight)} .bg-t{background:var(--c-station)} .bg-o{background:var(--c-other)}
/* แผนหลัก = วงกลมสีหลักมีเลขลำดับ · แผนรอง = วงขาวขอบประ · สถานที่อื่น = จุดสีแบบ Google Maps (เล็กและจางกว่า) */
.pin-stop{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font:700 12px/1 var(--f-num);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin-stop.active{width:30px;height:30px;font-size:14px;box-shadow:0 0 0 5px color-mix(in srgb, var(--ink) 25%, transparent),0 1px 5px rgba(0,0,0,.4)}
.gpin{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--gc);border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3);opacity:.92}
.gpin .msr{width:12px;height:12px}
.map-plan{top:52px}
.map-plan .chip .msr,.map-plan .chip svg{width:15px;height:15px;fill:currentColor}
.map-plan .chip[aria-pressed="false"]{opacity:.8}
.map-range{position:absolute;z-index:550;top:94px;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.me{width:18px;height:18px;border-radius:50%;background:#2f7cf6;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,124,246,.25)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--ink)}
.leaflet-popup-content{margin:12px 14px;font:13px/1.45 var(--f-body);min-width:200px}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.leaflet-control-attribution{font-size:9px}
/* โหมดมืด: กลับสีภาพแผนที่ (เฉพาะพื้นแผนที่ หมุดไม่เปลี่ยน) */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6)} }
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6)}
.pop h4{margin:0 0 2px;font-size:14px}
.pop p{margin:6px 0}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-size:13px;text-decoration:none;color:var(--ink);font-weight:500}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn:disabled{opacity:.5}

/* Plan */
.dayhead{display:flex;flex-direction:column;gap:6px}
.facts{display:flex;gap:8px;flex-wrap:wrap}
.fact{background:var(--sunk);border-radius:8px;padding:6px 10px;font-size:12px}
.fact b{display:block;font-size:14px}
.next{display:flex;gap:12px;align-items:center;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:var(--r);padding:12px 14px}
.next .big{font:600 20px/1 var(--f-num);color:var(--accent)}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stop{display:grid;grid-template-columns:48px 20px 1fr;gap:0 10px}
.stop .t{font:600 13px/1.4 var(--f-num);color:var(--muted);padding-top:2px;text-align:right}
.rail{position:relative;display:flex;justify-content:center}
.rail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
.stop:first-child .rail::before{top:10px}
.stop:last-child .rail::before{bottom:calc(100% - 10px)}
.rail span{position:relative;margin-top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.stop.move .rail span{border-style:dashed;border-radius:3px}
.stop.done .rail span{background:var(--muted)}
.stop.active .rail span{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.stop .body{padding-bottom:18px;min-width:0}
.stop .body h4{margin:0;font-size:15px;line-height:1.35}
.stop.active .body h4{color:var(--accent)}
.stop .body p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.stop .meta{font-size:12px;color:var(--muted);margin-top:4px}
.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13px}

/* Nearby */
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=text],input[type=number],input[type=url],input[type=date],input[type=password]{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;min-width:0;width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface);flex:none}
.seg button{border:0;background:none;padding:7px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.cats::-webkit-scrollbar{display:none}
.cats .chip{box-shadow:none}
.cats .chip[aria-pressed="true"]{border-color:var(--ink);opacity:1}
.cats .chip[aria-pressed="false"]{opacity:.75}
.count{font-family:var(--f-num);font-size:11px;color:var(--muted)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pitem{display:grid;grid-template-columns:30px 1fr auto;gap:10px;padding:12px;border-top:1px solid var(--line);align-items:start}
.pitem:first-child{border-top:0}
.pitem .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 13px/1 var(--f-jp)}
.pitem h4{margin:0;font-size:14px;line-height:1.35}
.pitem p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.pitem .d{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.pitem .d b{display:block;font:600 14px/1.2 var(--f-num);color:var(--ink)}
.pitem .links{margin-top:6px}
.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);vertical-align:middle;white-space:nowrap}
.tag.on{background:var(--accent-soft);color:var(--accent)}
.btn.add{border-style:dashed;color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.planbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tin{width:auto;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:2px 4px;font:600 12px/1.4 var(--f-num)}
.stop .t:has(.tin){padding-top:0}
.stop{grid-template-columns:auto 20px 1fr}
.stop .t{min-width:44px}
.stop.added .rail span{border-color:var(--accent)}
.ins{list-style:none;margin:-6px 0 4px 74px}
.insbtn{border:1px dashed var(--line);background:none;color:var(--muted);border-radius:7px;font-size:11px;padding:1px 8px}
.insbtn:hover,.insbtn:focus-visible{color:var(--accent);border-color:var(--accent)}
.ins-form{list-style:none;margin:0 0 10px}
.stop.locked .body h4 .lockic{font-size:12px;margin-right:4px}
.drag{display:grid;place-items:center;margin:6px 0 0 auto;width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--surface);touch-action:none;cursor:grab;padding:0}
.drag svg{width:16px;height:16px;fill:var(--muted)}
.stop.dragging{position:relative;z-index:3;background:var(--surface);box-shadow:0 6px 18px rgba(0,0,0,.18);border-radius:10px}
.stop.drop-before{box-shadow:inset 0 3px 0 var(--accent)}
.stop.drop-after{box-shadow:inset 0 -3px 0 var(--accent)}
.ein{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 9px;font:inherit;font-size:14px;margin-bottom:6px;resize:vertical}
.ein[data-f="n"]{font-weight:600}
textarea{font:inherit}
.imp{display:flex;flex-direction:column;gap:10px}
.imp .steps{font-size:12px;color:var(--muted)}
.alts{display:flex;flex-direction:column;gap:10px}
.plist.flat{border:0;border-radius:0;background:transparent;margin-inline:-14px;margin-bottom:-14px;border-top:1px solid var(--line)}
.pin-alt{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px dashed var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.pin-alt .msr{width:12px;height:12px;fill:var(--accent)}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:13px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--sunk);border-radius:var(--r);padding:10px 12px;font-size:13px}

/* Expenses */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum .k{font-size:12px;color:var(--muted)}
.sum .v{font:600 22px/1.2 var(--f-num)}
.sum .v small{font-size:13px;color:var(--muted);font-weight:500}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar i.over{background:var(--bad)}
.brk{display:flex;flex-direction:column;gap:8px}
.brk .row{display:grid;grid-template-columns:88px 1fr 92px;gap:8px;align-items:center;font-size:13px}
.brk .row .num{text-align:right;font-size:12px}
.brk.bud .row{grid-template-columns:88px 1fr auto}
.bcats{display:flex;flex-direction:column;gap:6px}
.bcat{display:flex;gap:6px;align-items:center}
.bcat input[type=text]{flex:1}
.bcat input[type=number]{width:96px;flex:none}
.bcat .bx{width:30px;flex:none;padding:4px 0}
#budEd .field{margin-top:10px}
#budEd .seg{align-self:flex-start}
form.exp{display:flex;flex-direction:column;gap:10px}
.amt{display:grid;grid-template-columns:1fr auto;gap:8px}
.amt input{font:600 22px/1.2 var(--f-num);padding:10px 12px}
.choice{display:flex;gap:6px;flex-wrap:wrap}
.choice button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px}
.choice button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.elist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.eday{padding:8px 12px;background:var(--sunk);font-size:12px;display:flex;justify-content:space-between;color:var(--muted);font-weight:600}
.eitem{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
.eitem h4{margin:0;font-size:14px;font-weight:500}
.eitem p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.eitem .a{text-align:right}
.eitem .a b{font:600 15px/1.2 var(--f-num);display:block}
.eitem .a span{font-size:11px;color:var(--muted)}
.sync{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.sync.y{background:var(--ok)} .sync.n{background:var(--warn)}
.confirm{display:flex;gap:6px;margin-top:6px}
.inrow{display:grid;grid-template-columns:1fr auto;gap:8px}
/* Split + settle */
.splitrows{display:flex;flex-direction:column;gap:6px}
.srow{display:grid;grid-template-columns:1fr 120px;gap:8px;align-items:center;font-size:14px}
.items{display:flex;flex-direction:column;gap:10px}
.item{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.eitem.editing{background:var(--accent-soft)}
.baltab{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:6px 8px;margin-top:10px;font-size:13px;align-items:center}
.baltab .bh{font-size:11px;color:var(--muted);font-weight:600}
.baltab>div:nth-child(4n+2),.baltab>div:nth-child(4n+3),.baltab>div:nth-child(4n){text-align:right}
/* Trips */
.tlist{display:flex;flex-direction:column;gap:8px}
.tcard{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;color:var(--ink)}
.tcard.cur{border-color:var(--accent);background:var(--accent-soft)}
.tcard .tname{font-weight:600;font-size:15px}
.tcard .tmeta{font-size:12px;color:var(--muted)}

/* Settings */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch input{width:44px;height:26px;accent-color:var(--accent)}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13px}
pre.code{margin:0;max-height:240px;overflow:auto;background:var(--sunk);border-radius:9px;padding:10px;font:11px/1.5 var(--f-num);white-space:pre}
.msg{font-size:12px;color:var(--muted);min-height:1em}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:1000;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: no-preference){ .toast{animation:up .2s ease-out} @keyframes up{from{transform:translate(-50%,8px);opacity:0}} }
/* มือถือ: ขนาดกระชับขึ้น เห็นเนื้อหาได้มากขึ้นต่อหน้าจอ */
@media (max-width:520px){
  body{font-size:14px}
  .top{padding-block:6px 4px}
  .days{padding-block:2px 6px}
  .daybtn{padding:4px 10px;border-radius:9px}
  .daybtn b{font-size:12px} .daybtn span{font-size:10.5px}
  .pad{padding-block:10px 16px;gap:10px}
  .card{padding:11px 12px}
  h2{font-size:16px}
  .dayhead{gap:4px}
  .fact{padding:4px 8px;font-size:11.5px}
  .stop .body{padding-bottom:10px}
  .stop .body h4{font-size:14px;line-height:1.3}
  .stop .body p{margin-top:2px;font-size:12px;line-height:1.4}
  .stop .t{font-size:12px}
  .links{margin-top:5px;gap:5px}
  .btn{padding:6px 10px}
  .btn.sm{padding:3px 8px;font-size:11.5px}
  .pitem{padding:9px 10px;gap:8px}
  .tab{padding:5px 2px 4px;font-size:10.5px}
  .tab svg{width:20px;height:20px}
}

<script type="text/plain" id="gsCode">/**
 * Trip Dashboard – Google Sheet sync
 * วิธีใช้: Google Sheet > ส่วนขยาย > Apps Script > วางโค้ดนี้ > บันทึก
 *        > ทำให้ใช้งานได้ > การทำให้ใช้งานได้รายการใหม่ > เว็บแอป
 *          ดำเนินการในฐานะ: ฉัน | ผู้มีสิทธิ์เข้าถึง: ทุกคน
 * แล้วนำ URL ที่ลงท้ายด้วย /exec ไปวางในหน้า "ตั้งค่า" ของแอป
 */

// รหัสลับ (ต้องตรงกับช่อง "รหัสลับ" ในแอป) ปล่อยว่างได้ถ้าไม่ต้องการ
const SECRET = '';

// ทริปแรก (โตเกียว) — แถวเก่าที่ไม่มีคอลัมน์ "ทริป" ถือเป็นของทริปนี้
const DEF_TRIP = 'tokyo';
const EXP = 'Expenses';
const LOC = 'Locations';
const EXP_HEAD = ['id', 'วันที่-เวลา', 'วันที่ทริป', 'จำนวนเงิน', 'สกุลเงิน', 'เทียบบาท', 'หมวด', 'ชำระด้วย', 'รายละเอียด', 'lat', 'lng', 'อัปเดตล่าสุด', 'ทริป', 'คนจ่าย (id)', 'การหาร (JSON)'];
const SETL = 'Settlements';
const SETL_HEAD = ['id', 'ทริป', 'จาก (id)', 'ถึง (id)', 'จำนวน (บาท)', 'เวลา', 'อัปเดตล่าสุด'];
// สแกนบิล: ใส่ GEMINI_KEY (และ GEMINI_MODEL ถ้าต้องการเปลี่ยนโมเดล) ที่ Apps Script > ตั้งค่าโปรเจกต์ (รูปเฟือง) > Script Properties
const GEMINI_MODELS = ['gemini-3.8-flash', 'gemini-3.5-flash-lite'];
const LOC_HEAD = ['เวลา', 'วันที่ทริป', 'lat', 'lng', 'ความแม่นยำ (ม.)', 'แผนที่', 'ทริป'];
const SET = 'Settings';
const SET_HEAD = ['key', 'value', 'อัปเดตล่าสุด'];
const TRIP = 'Trips';
const TRIP_HEAD = ['id', 'ชื่อทริป', 'วันเริ่ม', 'จำนวนวัน', 'สกุลเงิน', 'เรท (1 หน่วย = ? บาท)', 'งบ (บาท)', 'ประเทศ', 'lat', 'lng', 'ชุดข้อมูล', 'อัปเดตล่าสุด', 'ซ่อน', 'รหัสเข้าร่วม', 'เจ้าของ (รหัสเครื่อง)'];
const PLAN = 'Plans';
const PLAN_HEAD = ['ทริป', 'วัน', 'ชื่อวัน', 'ข้อมูลแผน (JSON)', 'อัปเดตล่าสุด'];
const MEM = 'Members';
const MEM_HEAD = ['ทริป', 'id', 'ชื่อ', 'อัปเดตล่าสุด'];

function sheet_(name, head) {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let sh = ss.getSheetByName(name);
  if (!sh) {
    sh = ss.insertSheet(name);
    sh.appendRow(head);
    sh.setFrozenRows(1);
    sh.getRange(1, 1, 1, head.length).setFontWeight('bold').setBackground('#e8ecf6');
  } else if (sh.getLastColumn() < head.length) {
    // แท็บเดิมจากเวอร์ชันก่อน: เติมหัวคอลัมน์ใหม่
    sh.getRange(1, 1, 1, head.length).setValues([head]).setFontWeight('bold').setBackground('#e8ecf6');
  }
  return sh;
}
// คีย์ผสมจากหลายคอลัมน์แรก เช่น ทริป|วัน
function keys_(sh, n) {
  const rows = sh.getLastRow() - 1;
  return rows > 0 ? sh.getRange(2, 1, rows, n).getDisplayValues().map(function (r) { return r.join('|'); }) : [];
}
function upsertRows_(sh, n, rows) {
  const ks = keys_(sh, n);
  rows.forEach(function (row) {
    const k = row.slice(0, n).map(String).join('|');
    const i = ks.indexOf(k);
    if (i >= 0) sh.getRange(i + 2, 1, 1, row.length).setValues([row]);
    else { sh.appendRow(row); ks.push(k); }
  });
}
function deleteRows_(sh, n, list) {
  const ks = keys_(sh, n);
  for (let i = ks.length - 1; i >= 0; i--) if (list.indexOf(ks[i]) >= 0) sh.deleteRow(i + 2);
}
function textSheet_(name, head, cols) {
  const sh = sheet_(name, head);
  cols.forEach(function (c) { sh.getRange(c + ':' + c).setNumberFormat('@'); });
  return sh;
}
function dstr_(v) {
  return v instanceof Date ? Utilities.formatDate(v, Session.getScriptTimeZone(), 'yyyy-MM-dd') : String(v || '');
}
// ทริปที่ "ซ่อน" เห็นและแก้ได้เฉพาะเครื่องที่มีรหัสเข้าร่วม (ได้จากลิงก์เชิญเข้าทริป)
function tripRows_() {
  const sh = textSheet_(TRIP, TRIP_HEAD, ['A', 'C', 'N', 'O']);
  const n = sh.getLastRow() - 1;
  return { sh: sh, vals: n > 0 ? sh.getRange(2, 1, n, TRIP_HEAD.length).getValues() : [] };
}
function isHidden_(r) { return r[12] === true || String(r[12]).toUpperCase() === 'TRUE'; }
// codes = {tripId: รหัส} ที่เครื่องนั้นมี · คืน id ทริปที่ซ่อนและเครื่องนี้ไม่มีสิทธิ์
function blocked_(codes) {
  const out = {};
  tripRows_().vals.forEach(function (r) { if (r[0] !== '' && isHidden_(r) && String((codes || {})[String(r[0])] || '') !== String(r[13])) out[String(r[0])] = 1; });
  return out;
}
function parseCodes_(s) {
  const o = {};
  String(s || '').split(',').forEach(function (x) { const i = x.indexOf(':'); if (i > 0) o[x.slice(0, i)] = x.slice(i + 1); });
  return o;
}
function readTrips_(codes) {
  const bl = blocked_(codes);
  const all = tripRows_().vals.filter(function (r) { return r[0] !== ''; });
  return {
    hidden: all.filter(function (r) { return bl[String(r[0])]; }).map(function (r) { return String(r[0]); }),
    trips: all.filter(function (r) { return !bl[String(r[0])]; }).map(function (r) {
      return { id: String(r[0]), name: String(r[1]), start: dstr_(r[2]), ndays: Number(r[3]) || 1, cur: String(r[4] || 'THB'),
        rate: Number(r[5]) || 1, budget: Number(r[6]) || 0, region: String(r[7] || ''), lat: r[8] === '' ? null : Number(r[8]),
        lng: r[9] === '' ? null : Number(r[9]), seed: String(r[10] || ''), rev: r[11] ? new Date(r[11]).getTime() : 0,
        hidden: isHidden_(r), code: isHidden_(r) ? String(r[13]) : '', owned: String(r[14] || '') !== '' };
    })
  };
}
function readMembers_() {
  const sh = textSheet_(MEM, MEM_HEAD, ['A', 'B']);
  const n = sh.getLastRow() - 1;
  const vals = n > 0 ? sh.getRange(2, 1, n, MEM_HEAD.length).getValues() : [];
  return vals.filter(function (r) { return r[1] !== ''; }).map(function (r) {
    return { trip: String(r[0]), id: String(r[1]), name: String(r[2]), rev: r[3] ? new Date(r[3]).getTime() : 0 };
  });
}
function readPlans_(trip) {
  const sh = textSheet_(PLAN, PLAN_HEAD, ['A', 'D']);
  const n = sh.getLastRow() - 1;
  const vals = n > 0 ? sh.getRange(2, 1, n, PLAN_HEAD.length).getValues() : [];
  return vals.filter(function (r) { return String(r[0]) === trip; }).map(function (r) {
    return { day: Number(r[1]), data: String(r[3]), rev: r[4] ? new Date(r[4]).getTime() : 0 };
  });
}

// การตั้งค่ากลางของทริป (ทุกคนเห็นเหมือนกัน) เก็บเป็นข้อความล้วน
function setSheet_() {
  const sh = sheet_(SET, SET_HEAD);
  sh.getRange('A:B').setNumberFormat('@');
  return sh;
}
function readSettings_() {
  const sh = setSheet_();
  const n = sh.getLastRow() - 1;
  const o = {};
  if (n > 0) sh.getRange(2, 1, n, 2).getDisplayValues().forEach(function (r) { if (r[0] !== '') o[r[0]] = r[1]; });
  return o;
}

// อ่านชื่อร้าน + พิกัดจากลิงก์แชร์ของ Google Maps (เปิดเฉพาะลิงก์ของ Google) และหาพิกัดจากที่อยู่ด้วย Maps service ของ Apps Script
function resolve_(u, t, rg) {
  let url = String(u || ''), name = '', lat = null, lng = null;
  try {
    for (let i = 0; i < 5; i++) {
      if (!/^https:\/\/(maps\.app\.goo\.gl|goo\.gl|g\.co)\//.test(url)) break;
      const r = UrlFetchApp.fetch(url, { followRedirects: false, muteHttpExceptions: true });
      const h = r.getAllHeaders(); const loc = h['Location'] || h['location'];
      if (!loc) break;
      url = Array.isArray(loc) ? loc[0] : loc;
    }
  } catch (err) {}
  const m = url.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || url.match(/[?&](?:q|query|ll)=(-?\d+\.\d+),(-?\d+\.\d+)/);
  if (m) { lat = +m[1]; lng = +m[2]; }
  const pm = url.match(/\/place\/([^\/@?]+)/);
  if (pm) { try { name = decodeURIComponent(pm[1].replace(/\+/g, ' ')); } catch (err) { name = pm[1]; } }
  if (lat === null) {
    const q = String(t || name).trim();
    if (q) {
      try {
        const g = Maps.newGeocoder().setRegion(String(rg || 'jp')).geocode(q);
        if (g.status === 'OK' && g.results.length) { lat = g.results[0].geometry.location.lat; lng = g.results[0].geometry.location.lng; }
      } catch (err) {}
    }
  }
  return { ok: true, url: url, name: name, lat: lat, lng: lng };
}

function out_(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}

function ids_(sh) {
  const n = sh.getLastRow() - 1;
  return n > 0 ? sh.getRange(2, 1, n, 1).getValues().map(function (r) { return String(r[0]); }) : [];
}

// อ่านบิลจากรูปด้วย Gemini — คืน {merchant, date, currency, total, category, items:[{name, qty, price}]}
const SCAN_SCHEMA = { type: 'object', properties: {
  merchant: { type: 'string' }, date: { type: 'string' }, currency: { type: 'string' }, total: { type: 'number' },
  category: { type: 'string', enum: ['food', 'transport', 'shop', 'gift', 'ticket', 'hotel', 'other'] },
  items: { type: 'array', items: { type: 'object', properties: { name: { type: 'string' }, qty: { type: 'number' }, price: { type: 'number' } }, required: ['name', 'price'] } }
}, required: ['total', 'items'] };
function scanPrompt_(cur) {
  return 'อ่านใบเสร็จในรูปนี้ แล้วตอบเป็น JSON ตาม schema เท่านั้น\n' +
    '- merchant: ชื่อร้าน (ภาษาเดิมในบิล)\n- date: วันที่ในบิลรูปแบบ YYYY-MM-DD ถ้าไม่มีให้เป็นค่าว่าง\n' +
    '- currency: รหัสสกุลเงิน ISO 4217 ของบิล (ถ้าไม่ระบุให้เดาจากประเทศ ค่าเริ่มต้น ' + cur + ')\n' +
    '- total: ยอดที่ต้องจ่ายจริงทั้งหมด (รวมภาษี/ค่าบริการ หักส่วนลดแล้ว)\n' +

function geminiText_(j) {

  (j.outputs || []).forEach(function (c) { if (c.text) t.push(c.text); });

function scan_(d) {
  const props = PropertiesService.getScriptProperties();
  const key = props.getProperty('GEMINI_KEY');
  if (!key) return { ok: false, error: 'ยังไม่ได้ใส่ GEMINI_KEY ใน Script Properties ของ Apps Script' };
  const img = String(d.image || ''), mime = String(d.mime || 'image/jpeg'), cur = String(d.cur || 'JPY');
  if (!img || img.length > 14000000) return { ok: false, error: 'รูปใหญ่เกินไปหรือไม่มีรูป' };
  const models = (props.getProperty('GEMINI_MODEL') ? [props.getProperty('GEMINI_MODEL')] : []).concat(GEMINI_MODELS);
  const head = { 'x-goog-api-key': key };
  let last = '';
  for (let i = 0; i < models.length; i++) {
    const m = models[i];
    // Interactions API (ปัจจุบัน) → ถ้าใช้ไม่ได้ ลอง generateContent (แบบเดิม)
    const tries = [
      ['https://generativelanguage.googleapis.com/v1beta/interactions', { model: m,
        input: [{ type: 'text', text: scanPrompt_(cur) }, { type: 'image', data: img, mime_type: mime }],
        response_format: { type: 'text', mime_type: 'application/json', schema: SCAN_SCHEMA } }],
      ['https://generativelanguage.googleapis.com/v1beta/models/' + m + ':generateContent', {
        contents: [{ parts: [{ inline_data: { mime_type: mime, data: img } }, { text: scanPrompt_(cur) }] }],
        generationConfig: { responseMimeType: 'application/json', temperature: 0 } }]
    ];
    for (let k = 0; k < tries.length; k++) {
      let r;
      try { r = UrlFetchApp.fetch(tries[k][0], { method: 'post', contentType: 'application/json', headers: head, payload: JSON.stringify(tries[k][1]), muteHttpExceptions: true }); }
      catch (err) { last = String(err); continue; }
      const code = r.getResponseCode(), txt = r.getContentText();
      if (code === 200) {
        try {
          const raw = geminiText_(JSON.parse(txt)).replace(/^```(?:json)?\s*|\s*```$/g, '');
          const o = JSON.parse(raw);
          return { ok: true, model: m, bill: { merchant: String(o.merchant || ''), date: String(o.date || ''), currency: String(o.currency || '').toUpperCase(),
            total: Number(o.total) || 0, category: String(o.category || ''),
            items: (o.items || []).map(function (x) { return { name: String(x.name || ''), qty: Number(x.qty) || 1, price: Number(x.price) || 0 }; }).filter(function (x) { return x.name && x.price; }) } };
        } catch (err) { last = 'อ่านผลจาก Gemini ไม่ได้'; continue; }
      }
      last = code + ' ' + txt.slice(0, 200);
      if (code === 400 && /API key/i.test(txt)) return { ok: false, error: 'GEMINI_KEY ไม่ถูกต้อง' };
    }
  }

}

function doPost(e) {
  let pre;
  try { pre = JSON.parse(e.postData.contents); } catch (err) { return out_({ ok: false, error: 'ข้อมูลไม่ถูกต้อง' }); }
  if (pre.action === 'scan') { // ไม่ต้องล็อก Sheet (ใช้เวลานาน)
    if (SECRET && pre.key !== SECRET) return out_({ ok: false, error: 'รหัสลับไม่ถูกต้อง' });
    return out_(scan_(pre));
  }
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    const d = pre;
    if (SECRET && d.key !== SECRET) return out_({ ok: false, error: 'รหัสลับไม่ถูกต้อง' });
    const bl = blocked_(d.codes);
    const DENY = { ok: false, error: 'ทริปนี้ถูกซ่อน ต้องเข้าร่วมทริปด้วยลิงก์เชิญก่อน', denied: true };

    if (d.action === 'upsert') {
      const sh = sheet_(EXP, EXP_HEAD);
      const ids = ids_(sh);
      const n0 = sh.getLastRow() - 1;
      const oldTrip = n0 > 0 ? sh.getRange(2, 13, n0, 1).getValues().map(function (r) { return String(r[0] || DEF_TRIP); }) : [];
      if (d.items.some(function (x) { const i = ids.indexOf(String(x.id)); return bl[String(x.trip || DEF_TRIP)] || (i >= 0 && bl[oldTrip[i]]); })) return out_(DENY);
      d.items.forEach(function (x) {
        const row = [x.id, new Date(x.ts), x.day, x.amount, x.cur, x.thb, x.cat, x.pay, x.note, x.lat || '', x.lng || '', new Date(), x.trip || DEF_TRIP,
          x.payer || '', x.split ? JSON.stringify(x.split) : ''];
        const i = ids.indexOf(String(x.id));
        if (i >= 0) sh.getRange(i + 2, 1, 1, row.length).setValues([row]);
        else { sh.appendRow(row); ids.push(String(x.id)); }
      });
      return out_({ ok: true, n: d.items.length });
    }

    if (d.action === 'delete') {
      const sh = sheet_(EXP, EXP_HEAD);
      const ids = ids_(sh);
      const n0 = sh.getLastRow() - 1;
      const tr = n0 > 0 ? sh.getRange(2, 13, n0, 1).getValues().map(function (r) { return String(r[0] || DEF_TRIP); }) : [];
      for (let i = ids.length - 1; i >= 0; i--) {
        if (d.ids.indexOf(ids[i]) >= 0 && !bl[tr[i]]) sh.deleteRow(i + 2);
      }
      return out_({ ok: true });
    }

    if (d.action === 'settings') {
      const sh = setSheet_();
      const ids = ids_(sh);
      Object.keys(d.values || {}).forEach(function (k) {
        const row = [k, String(d.values[k]), new Date()];
        const i = ids.indexOf(k);
        if (i >= 0) sh.getRange(i + 2, 1, 1, 3).setValues([row]);
        else { sh.appendRow(row); ids.push(k); }
      });
      return out_({ ok: true, settings: readSettings_() });
    }

    if (d.action === 'trip') {
      const t = d.trip || {};
      if (!t.id) return out_({ ok: false, error: 'ไม่มี id ทริป' });
      if (bl[String(t.id)]) return out_(DENY);
      const now = new Date();
      const old = tripRows_().vals.filter(function (r) { return String(r[0]) === String(t.id); })[0];
      // ซ่อน/รหัส/เจ้าของ: คงค่าเดิม · เปลี่ยนได้เฉพาะเจ้าของทริป (ทริปเก่าที่ยังไม่มีเจ้าของ คนแรกที่ตั้งค่าซ่อนจะเป็นเจ้าของ)
      let hid = old ? isHidden_(old) : false, code = old ? String(old[13] || '') : '', owner = old ? String(old[14] || '') : String(d.owner || '');
      if (d.privacy) {
        if (owner && owner !== String(d.owner || '')) return out_({ ok: false, error: 'เฉพาะคนสร้างทริปเท่านั้นที่ตั้งค่าซ่อนทริปได้' });
        if (!owner) owner = String(d.owner || '');
        hid = !!d.privacy.hidden; if (d.privacy.code) code = String(d.privacy.code);
        if (hid && !code) return out_({ ok: false, error: 'ไม่มีรหัสเข้าร่วม' });
      }
      upsertRows_(tripRows_().sh, 1, [[String(t.id), t.name || '', String(t.start || ''), Number(t.ndays) || 1, t.cur || 'THB',
        Number(t.rate) || 1, Number(t.budget) || 0, t.region || '', t.lat == null ? '' : t.lat, t.lng == null ? '' : t.lng, t.seed || '', now, hid, code, owner]]);
      return out_({ ok: true, rev: now.getTime(), hidden: hid, code: hid ? code : '', owned: !!owner });
    }

    if (d.action === 'plan') {
      if ((d.items || []).concat(d.drop || []).some(function (x) { return bl[String(x.trip)]; })) return out_(DENY);
      const sh = textSheet_(PLAN, PLAN_HEAD, ['A', 'D']);
      const now = new Date();
      upsertRows_(sh, 2, (d.items || []).map(function (x) { return [String(x.trip), Number(x.day), x.title || '', String(x.data || '{}'), now]; }));
      if (d.drop && d.drop.length) deleteRows_(sh, 2, d.drop.map(function (x) { return String(x.trip) + '|' + Number(x.day); }));
      return out_({ ok: true, rev: now.getTime() });
    }

    if (d.action === 'member') {
      if ((d.items || []).concat(d.del || []).some(function (x) { return bl[String(x.trip)]; })) return out_(DENY);
      const sh = textSheet_(MEM, MEM_HEAD, ['A', 'B']);
      const now = new Date();
      upsertRows_(sh, 2, (d.items || []).map(function (x) { return [String(x.trip), String(x.id), x.name || '', now]; }));
      if (d.del && d.del.length) deleteRows_(sh, 2, d.del.map(function (x) { return String(x.trip) + '|' + String(x.id); }));
      return out_({ ok: true, rev: now.getTime() });
    }

    if (d.action === 'settle') {
      const sh = textSheet_(SETL, SETL_HEAD, ['A', 'B', 'C', 'D']);
      const all = (d.items || []).concat(d.del || []);
      if (all.some(function (x) { return bl[String(x.trip)]; })) return out_(DENY);

      upsertRows_(sh, 1, (d.items || []).map(function (x) { return [String(x.id), String(x.trip), String(x.from), String(x.to), Number(x.amt) || 0, new Date(x.ts || Date.now()), now]; }));

    }

    return out_({ ok: false, error: 'unknown action' });
  } catch (err) {
    return out_({ ok: false, error: String(err) });
  } finally {
    lock.releaseLock();
  }
}

function doGet(e) {
  if (SECRET && (!e.parameter || e.parameter.key !== SECRET)) return out_({ ok: false, error: 'รหัสลับไม่ถูกต้อง' });
  if (e.parameter && e.parameter.type === 'settings') return out_({ ok: true, settings: readSettings_() });
  if (e.parameter && e.parameter.type === 'resolve') return out_(resolve_(e.parameter.u || '', e.parameter.t || '', e.parameter.r || ''));
  const codes = parseCodes_(e.parameter && e.parameter.c);
  if (e.parameter && e.parameter.type === 'trips') {
    const bl = blocked_(codes), tr = readTrips_(codes);
    return out_({ ok: true, trips: tr.trips, hidden: tr.hidden, members: readMembers_().filter(function (m) { return !bl[m.trip]; }) });
  }
  if (e.parameter && e.parameter.type === 'settles') {
    const bl = blocked_(codes), sh = textSheet_(SETL, SETL_HEAD, ['A', 'B', 'C', 'D']);
    const n = sh.getLastRow() - 1;
    const vals = n > 0 ? sh.getRange(2, 1, n, SETL_HEAD.length).getValues() : [];

  }

  }

  const n = sh.getLastRow() - 1;
  const vals = n > 0 ? sh.getRange(2, 1, n, EXP_HEAD.length).getValues() : [];
  const items = vals.map(function (r) {
    return {
      id: String(r[0]), ts: new Date(r[1]).getTime(), day: r[2], amount: Number(r[3]), cur: r[4],
      thb: Number(r[5]), cat: r[6], pay: r[7], note: r[8], lat: r[9], lng: r[10], trip: String(r[12] || DEF_TRIP),
      upd: r[11] ? new Date(r[11]).getTime() : 0, payer: String(r[13] || ''), split: (function () { try { return r[14] ? JSON.parse(r[14]) : null; } catch (err) { return null; } })()

function dist(a,b){ const R=6371000, r=x=>x*Math.PI/180; const dLa=r(b[0]-a[0]), dLo=r(b[1]-a[1]);
  const h=Math.sin(dLa/2)**2 + Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
const fmtD = m => m < 1000 ? (Math.round(m/10)*10)+' '+__('ม.')+'' : (m/1000).toFixed(m<10000?1:0)+' '+__('กม.')+'';

function tripDate(n){ const st=T().start; if(!st) return null; const d=new Date(st+'T00:00:00'); d.setDate(d.getDate()+n-1); return d; }
function autoDay(){ const st=T().start; if(!st) return 0; const s=new Date(st+'T00:00:00'), t=new Date(); t.setHours(0,0,0,0);
  const n = Math.round((t-s)/86400000)+1; return (n>=1 && n<=T().ndays) ? n : 0; }
function isToday(n){ const d=tripDate(n); if(!d) return false; const t=new Date(); return d.toDateString()===t.toDateString(); }
function activeIdx(day){ if(!isToday(day.n)) return -1; const now=new Date(), hm=now.getHours()*60+now.getMinutes(); let a=0;
  day.stops.forEach((s,i)=>{ const [h,m]=(s.t||'00:00').split(':').map(Number); if(h*60+m<=hm) a=i; }); return a; }
DAYS.forEach((d,i)=>{ d.n=i+1; d.stops.forEach((s,j)=>s.id='d'+d.n+'s'+j); });

/* ============ EDITABLE PLAN (แผนหลัก + แผนรอง · แก้ได้ทุกรายการ · ซิงก์ผ่าน Google Sheet) ============ */
const AREA_ZONE = {nrt_ap:'nrt', narita:'nrt', kamakura:'kmk', hase:'kmk', enoshima:'kmk'};
const zoneOf = p => !isTokyo() ? '' : p.area && AREA_ZONE[p.area] ? AREA_ZONE[p.area] : (p.ll[0] < 35.45 ? 'kmk' : p.ll[1] > 140.1 ? 'nrt' : 'tyo');
const ALT_SEED = {}; // แผนรองตั้งต้น (แผน 9–13 พ.ย. ไม่มีแผนรอง เพิ่มเองได้ในแอป)
function poiStop(p,t,id){ return {id:id||uid('c'), t:t||'', z:zoneOf(p), n:p.name, ll:p.ll, q:p.ja, note:p.note, poi:p.id, cat:p.cat, gid:p.gid||'', url:p.gmaps?(p.url||''):''}; }
function defaultAlts(n){ return (ALT_SEED[n]||[]).map(j=>P.find(p=>p.ja===j)).filter(Boolean).map(p=>poiStop(p,'','a'+n+p.id)); }
// วันตั้งต้น: ทริปโตเกียวใช้แผนเดิมจาก DAYS · ทริปใหม่เป็นวันว่าง
function seedDay(t,n){
  if(isTokyoSeed(t.seed) && DAYS[n-1]){ const d=DAYS[n-1];
    return {title:d.title, short:d.short, facts:clone(d.facts), tips:clone(d.tips), zone:d.zone, areas:clone(d.areas), stops:clone(d.stops), alts:defaultAlts(n), rev:0}; }
  return {title:'', short:'', facts:[], tips:[], zone:'', areas:[], stops:[], alts:[], rev:0};
}
// ย้ายแผนที่เคยแก้ไว้ในเครื่อง (เวอร์ชันก่อน: jt.plan) เข้าทริปโตเกียว — รวมกับของใน Sheet ตอนดึงครั้งแรก
(function migrateOldPlan(){
  if(plans[DEF_TRIP] || !trips[DEF_TRIP]) return;
  const old = load('jt.plan', null); plans[DEF_TRIP] = {};
  for(let n=1;n<=5;n++){ const d=seedDay(trips[DEF_TRIP],n); const c=old && old[n];
    if(c){ const added = c.added || (c.stops||[]).filter(s=>!/^d\d+s\d+$/.test(s.id)); d.stops=d.stops.concat(added); sortStops(d.stops); if(c.alts) d.alts=c.alts; d.mig=1; }
    plans[DEF_TRIP][n]=d; }
  savePlans();
})();
function dayOf(tid,n){ const t=trips[tid]; if(!plans[tid]) plans[tid]={}; if(!plans[tid][n]) plans[tid][n]=seedDay(t,n); return plans[tid][n]; }
// อัปเดตทริปโตเกียวเป็นแผน 9–13 พ.ย. 2026 (ครั้งเดียว) · แผนเดิมของทริปนี้ถูกแทนที่ทั้งหมด แล้วส่งขึ้น Sheet ให้ทุกคน
function migrateTokyoNov(){ const t=trips[DEF_TRIP]; if(!t || t.seed!=='tokyo') return false;
  Object.assign(t, {seed:TOKYO_SEED, start:'2026-11-09', ndays:5, dirty:true});
  plans[DEF_TRIP]={}; for(let n=1;n<=5;n++) plans[DEF_TRIP][n]=Object.assign(seedDay(t,n),{dirty:1});
  saveTrips(); savePlans(); if(curTrip===DEF_TRIP){ S.day=autoDay()||1; S.fitted=false; } return true; }
if(!settings.url) migrateTokyoNov(); // ไม่ได้เชื่อม Sheet: อัปเดตในเครื่องเลย · เชื่อม Sheet: ดูใน Sheet ก่อน (pullShared)
function plan(n){ const d=dayOf(curTrip,n); sortStops(d.stops); return d; }
function editPlan(n){ return plan(n); }
let planTimer=null;
function savePlan(n){ const d=dayOf(curTrip, n||S.day); d.dirty=1; d.edited=1; savePlans(); renderStatus();
  clearTimeout(planTimer); planTimer=setTimeout(()=>sync(), 1500); }
const hhmm = d => String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
function addMin(t,m){ const [h,mi]=(t||'10:00').split(':').map(Number); const x=Math.min(23*60+59, Math.max(0,h*60+mi+m)); return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0'); }
function timeOpts(cur){ const set=new Set([cur]); for(let m=5*60;m<24*60;m+=15) set.add(String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'));
  return [...set].sort().map(t=>`<option${t===cur?' selected':''}>${t}</option>`).join(''); }
function sortStops(st){ st.sort((a,b)=>(a.t||'').localeCompare(b.t||'')); }
function findStop(id){ const p=plan(S.day); return p.stops.find(s=>s.id===id) || p.alts.find(s=>s.id===id); }
function suggestTime(n, ll){
  const st=plan(n).stops;
  if(isToday(n)){ const d=new Date(); d.setMinutes(Math.ceil(d.getMinutes()/15)*15,0,0); return hhmm(d); }
  const a = S.anchor!=='gps' && st.find(s=>s.id===S.anchor);
  if(a) return addMin(a.t,30);
  const land = st.filter(s=>!s.mv);  // ไม่ได้อยู่ในวันนั้น: ต่อท้ายจุดในแผนที่ใกล้สถานที่นี้ที่สุด
  if(ll && land.length){ const near = land.reduce((b,s)=> dist(s.ll,ll) < dist(b.ll,ll) ? s : b); return addMin(near.t,30); }
  return st.length ? addMin(st[st.length-1].t,30) : '10:00';
}
const inPlan = (pid)=>{ const p=plan(S.day); return p.stops.some(s=>s.poi===pid) ? 'main' : p.alts.some(s=>s.poi===pid) ? 'alt' : ''; };
const LIVE = {}; // สถานที่จาก Google (เรียลไทม์)
const findPoi = pid => tripPlaces().find(x=>x.id===pid) || LIVE[pid];
function addToPlan(pid, mode){
  const p=findPoi(pid); if(!p) return; const ep=editPlan(S.day);
  if(mode==='alt'){ if(ep.alts.some(s=>s.poi===pid)){ toast(__('อยู่ในแผนรองแล้ว')); return; } ep.alts.push(poiStop(p,'')); toast(''+__('เพิ่ม')+' "'+p.name+'" '+__('ในแผนรอง')+''); }
  else { const slot = S.editMode && S.tab==='plan' && S.ins!=null ? S.ins : null;
    const t = slot!=null ? dropTime(ep.stops[slot-1], ep.stops[slot]) : suggestTime(S.day,p.ll); ep.alts=ep.alts.filter(s=>s.poi!==pid);
    if(slot!=null){ ep.stops.splice(slot,0,poiStop(p,t)); S.ins=null; } else ep.stops.push(poiStop(p,t)); sortStops(ep.stops); toast(''+__('ใส่')+' "'+p.name+'" '+__('ในแผนเวลา')+' '+t+' '+__('(แก้ได้ที่แท็บแผนวัน)')+''); }
  savePlan(); S.fitted=true; if(S.tab==='map'){ if(gmInfo) gmInfo.close(); if(map) map.closePopup(); } renderTab();
}
function promote(id){ const ep=editPlan(S.day); const i=ep.alts.findIndex(s=>s.id===id); if(i<0) return; const s=ep.alts.splice(i,1)[0];
  s.t=suggestTime(S.day,s.ll); ep.stops.push(s); sortStops(ep.stops); savePlan(); toast(''+__('ย้าย')+' "'+s.n+'" '+__('เข้าแผนเวลา')+' '+s.t); renderTab(); }
function demote(id){ if(locked(id)) return; const ep=editPlan(S.day); const i=ep.stops.findIndex(s=>s.id===id); if(i<0) return; const s=ep.stops.splice(i,1)[0];
  ep.alts.unshift(s); if(S.anchor===id) S.anchor='gps'; savePlan(); toast(''+__('ย้าย')+' "'+s.n+'" '+__('ไปแผนรอง')+''); renderTab(); }
function locked(id){ const s=findStop(id); if(s && s.lock){ toast(__('รายการนี้ล็อกอยู่ กดปลดล็อกก่อน')); return true; } return false; }
function toggleLock(id){ const s=findStop(id); if(!s) return; if(s.lock) delete s.lock; else s.lock=1; savePlan(); toast(s.lock?''+__('ล็อก')+' "'+s.n+'" '+__('แล้ว')+'':''+__('ปลดล็อก')+' "'+s.n+'" '+__('แล้ว')+''); renderTab(); }
/* ===== แทรกรายการระหว่างจุด (โหมดแก้ไขแผน) ===== */
function insRow(d,k){
  if(!S.editMode) return '';
  if(S.ins!==k) return `<li class="ins"><button class="insbtn" type="button" data-ins="${k}">${__('+ แทรกตรงนี้')}</button></li>`;
  const prev=d.stops[k-1], next=d.stops[k], t=dropTime(prev,next);
  const near=[prev,next].filter(Boolean);
  return `<li class="ins-form"><div class="card" style="display:flex;flex-direction:column;gap:8px">
    <span class="label">${__('แทรก')}${prev?' '+__('หลัง')+' '+esc(prev.t):''}${next?' '+__('ก่อน')+' '+esc(next.t):''}</span>
    <input id="in-n" type="text" placeholder="${__('ชื่อรายการ')}" aria-label="${__('ชื่อรายการ')}">
    <div class="row2"><div class="field"><label for="in-t">${__('เวลา')}</label><select id="in-t">${timeOpts(t)}</select></div>
      <div class="field"><label for="in-cat">${__('หมวด')}</label><select id="in-cat">${CAT_KEYS.map(c=>`<option value="${c}"${c==='h'?' selected':''}>${CAT[c].label}</option>`).join('')}</select></div></div>
    <div class="field"><label for="in-ll">${__('ตำแหน่ง')}</label><select id="in-ll">${near.map(s=>`<option value="${s.id}">${__('ใกล้')} ${esc(s.t+' '+tp(s.n))}</option>`).join('')}${S.pos?'<option value="gps">'+__('ตำแหน่งปัจจุบัน (GPS)')+'</option>':''}</select></div>
    <div class="ctrl"><button class="btn sm pri" type="button" id="in-ok">${__('แทรก')}</button><button class="btn sm" type="button" id="in-no">${__('ยกเลิก')}</button></div>
    <p class="sub" style="font-size:11.5px">${__('หรือค้นหาสถานที่ด้านล่าง แล้วกด')} "${__('+ ใส่ในแผน')}" ${__('รายการจะถูกแทรกตรงนี้')}</p></div></li>`;
}
function bindIns(){
  $('#planPad').querySelectorAll('[data-ins]').forEach(b=>b.onclick=()=>{ S.ins=+b.dataset.ins; renderPlan(); const i=$('#in-n'); if(i) i.focus(); });
  const ok=$('#in-ok'); if(!ok) return;
  $('#in-no').onclick=()=>{ S.ins=null; renderPlan(); };
  ok.onclick=()=>{ const n=$('#in-n').value.trim(); if(!n){ toast(__('ใส่ชื่อรายการก่อน')); $('#in-n').focus(); return; }
    const w=$('#in-ll').value; const ref = w==='gps' ? null : findStop(w);
    const ll = w==='gps' && S.pos ? [+S.pos.lat.toFixed(6), +S.pos.lng.toFixed(6)] : ref ? ref.ll : tripCenter();
    const ep=editPlan(S.day); const s={id:uid('c'), t:$('#in-t').value, z:zoneOf({ll}), n, ll, q:'', note:'', cat:$('#in-cat').value, custom:1};
    ep.stops.splice(S.ins,0,s); sortStops(ep.stops); S.ins=null; savePlan(); toast(''+__('แทรก')+' "'+n+'" '+__('เวลา')+' '+s.t); renderPlan(); };
}
function removeItem(id){ if(locked(id)) return; const ep=editPlan(S.day); ep.stops=ep.stops.filter(s=>s.id!==id); ep.alts=ep.alts.filter(s=>s.id!==id); if(S.anchor===id) S.anchor='gps'; savePlan(); renderTab(); }
function setTime(id,t){ if(!/^\d{2}:\d{2}$/.test(t) || locked(id)) return; const ep=editPlan(S.day); const s=ep.stops.find(x=>x.id===id); if(!s) return; s.t=t; sortStops(ep.stops); savePlan(); renderTab(); }
function editField(id,f,v){ if(locked(id)) return; const ep=editPlan(S.day); const s=ep.stops.find(x=>x.id===id) || ep.alts.find(x=>x.id===id); if(!s) return;
  v=String(v).trim(); if(f==='n' && !v) return; s[f]=v; if(f==='n'){ s.q = s.custom ? '' : s.q; } savePlan(); }
function editTitle(v){ const d=editPlan(S.day); d.title=String(v).trim(); d.short=d.title.length>14 ? d.title.slice(0,13)+'…' : d.title; savePlan(); renderDays(); }
function addCustom(mode){
  const n=$('#cu-n').value.trim(); if(!n){ toast(__('ใส่ชื่อรายการก่อน')); $('#cu-n').focus(); return; }
  const where=$('#cu-ll').value; let ll;
  if(where==='gps'){ if(!S.pos){ toast(__('ยังไม่มีตำแหน่ง GPS เลือกจุดใกล้เคียงแทน')); return; } ll=[+S.pos.lat.toFixed(6), +S.pos.lng.toFixed(6)]; }
  else { const st=plan(S.day).stops.find(s=>s.id===where); ll = st ? st.ll : tripCenter(); }
  const s={id:uid('c'), t:mode==='alt'?'':$('#cu-t').value, z:zoneOf({ll}), n, ll, q:'', note:$('#cu-note').value.trim(), cat:$('#cu-cat').value, custom:1};

}
function resetPlan(){ const d=plan(S.day), nd=seedDay(T(),S.day); Object.assign(d, nd, {rev:d.rev}); d.edited=0; d.dirty=1; savePlans(); sync();
  S.resetAsk=false; S.anchor = S.pos?'gps':((d.stops[0]||{}).id||'gps'); S.fitted=false; toast(''+__('คืนค่าแผนเดิมของวันที่')+' '+S.day+' '+__('แล้ว')+''); renderTab(); }

const curDay = ()=>{ const p=plan(S.day); return Object.assign({n:S.day, title:'', facts:[], tips:[], zone:'', areas:[]}, p, {stops:p.stops, alts:p.alts, edited:!!p.edited}); };
function toast(t){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const el=document.createElement('div'); el.className='toast'; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),2400); }

function renderStatus(){
  const gd=$('#gpsDot'), gt=$('#gpsTxt');
  if(S.watchId===null){ gd.className='dot'; gt.textContent=__('GPS ปิด'); }
  else if(!S.pos){ gd.className='dot warn'; gt.textContent=__('หาตำแหน่ง…'); }
  else { gd.className='dot on'; gt.textContent='GPS ±'+Math.round(S.pos.acc)+' '+__('ม.')+''; }
  const sd=$('#syncDot'), st=$('#syncTxt'); const n = expenses.filter(x=>!x.synced).length + pendingDel.length + pendingShared();
  if(!settings.url){ sd.className='dot'; st.textContent=__('Sheet ยังไม่ตั้งค่า'); }
  else if(S.syncing){ sd.className='dot warn'; st.textContent=__('กำลังซิงก์…'); }
  else if(S.syncErr){ sd.className='dot bad'; st.textContent=__('ซิงก์ไม่สำเร็จ'); }
  else if(n){ sd.className='dot warn'; st.textContent=''+__('รอซิงก์')+' '+n; }
  else { sd.className='dot on'; st.textContent=__('Sheet ซิงก์แล้ว'); }
}

  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===tab));
  ['map','plan','near','exp','set','trips'].forEach(t=>$('#v-'+t).hidden = t!==tab);
  renderTab(); if(tab==='map' && map){ setTimeout(()=>map.invalidateSize(),0); } }

/* ============ GPS ============ */
let wakeLock=null;
async function keepAwake(on){ try{ if(on && 'wakeLock' in navigator && document.visibilityState==='visible'){ wakeLock = await navigator.wakeLock.request('screen'); }
  else if(!on && wakeLock){ await wakeLock.release(); wakeLock=null; } }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && settings.wake && S.watchId!==null) keepAwake(true); });

function startGPS(){
  if(!('geolocation' in navigator)){ toast(__('อุปกรณ์นี้ไม่รองรับ GPS')); return; }
  S.watchId = navigator.geolocation.watchPosition(onPos, err=>{
    toast(err.code===1 ? __('ไม่ได้รับอนุญาตใช้ตำแหน่ง — เปิดสิทธิ์ Location ให้เบราว์เซอร์') : __('หาตำแหน่งไม่ได้ ลองออกไปที่โล่ง'));
    if(err.code===1){ stopGPS(); }
  }, {enableHighAccuracy:true, maximumAge:10000, timeout:30000});
  settings.gpsAuto=true; save('jt.settings',settings); if(settings.wake) keepAwake(true); renderStatus();
}
function stopGPS(){ if(S.watchId!==null) navigator.geolocation.clearWatch(S.watchId); S.watchId=null; S.pos=null;
  settings.gpsAuto=false; save('jt.settings',settings); keepAwake(false); drawMe(); renderStatus(); if(S.tab!=='map') renderTab(); }
let lastRender=0;
function onPos(p){
  const first = !S.pos;
  S.pos = {lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy, ts:p.timestamp};
  if(first && S.anchor!=='gps') S.anchor='gps';
  drawMe(first); renderStatus(); if(S.route) updateRoute();
  if(settings.logLoc && settings.url && Date.now()-S.lastLog >= settings.logMin*60000){
    S.lastLog=Date.now(); locQ.push({ts:Date.now(), trip:curTrip, day:S.day, lat:+S.pos.lat.toFixed(6), lng:+S.pos.lng.toFixed(6), acc:S.pos.acc}); save('jt.locq',locQ); sync();
  }
  if(Date.now()-lastRender > 15000 || first){ lastRender=Date.now(); if(S.tab==='near' || (S.tab==='plan' && !S.editMode)) renderTab(); }
}

function openMapAdd(ll){ const now=Date.now(); if(now-(S.lastPress||0)<800) return; S.lastPress=now; S.mapPt=ll;

function mapAdd(mode){ const ll=S.mapPt; const i=$('#mp-n'); if(!ll || !i) return; const n=i.value.trim(); if(!n){ toast(__('ตั้งชื่อจุดก่อน')); i.focus(); return; }

  const ep=editPlan(S.day); (mode==='alt'?ep.alts:ep.stops).push(s); sortStops(ep.stops); savePlan();

// แผนที่ฟรีไม่ต้องใช้ API Key: Esri เป็นหลัก (ใช้ได้ทั้งเปิดผ่านเว็บและเปิดไฟล์ตรงๆ) / OpenStreetMap สำรอง
const TILE_SRC = [
  {u:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', a:'Tiles © Esri', max:19},
  {u:'https://tile.openstreetmap.org/{z}/{x}/{y}.png', a:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>', max:19}
];
let tileIdx = settings.mapSrc==='osm' ? 1 : 0, tileTried=new Set(), tileErr=0, tileOk=0;
function setTiles(){ if(!map) return; if(tiles) map.removeLayer(tiles);
  const src=TILE_SRC[tileIdx]; tileTried.add(tileIdx); tileErr=0; tileOk=0;
  tiles = L.tileLayer(src.u,{maxZoom:20, maxNativeZoom:src.max, attribution:src.a, crossOrigin:false});
  tiles.on('tileload',()=>{ tileOk++; });
  tiles.on('tileerror',()=>{ if(++tileErr>=4 && tileOk===0){ const nx=TILE_SRC.findIndex((_,i)=>!tileTried.has(i)); if(nx>=0){ tileIdx=nx; setTiles(); } } });
  tiles.addTo(map); }

// ไอคอน/สีบนแผนที่แบบเดียวกับ Google Maps
const MAP_PAD = {paddingTopLeft:[30,140], paddingBottomRight:[30,70], maxZoom:16}; // เว้นที่ให้แถบปุ่มด้านบน/ล่างของแผนที่
const CAT_GI = {f:['restaurant','#F57C00'], s:['shopping_bag','#4285F4'], h:['photo_camera','#12B5CB'], t:['train','#1A73E8'], o:['info','#7B8794']};
const catGi = c => CAT_GI[c] || CAT_GI.h;
const poiPin  = p => `<div class="gpin" style="--gc:${catGi(p.cat)[1]}">${mi(catGi(p.cat)[0])}</div>`;
const altPin  = s => `<div class="pin-alt" title="${__('แผนรอง')}">${mi(catGi(s.cat)[0])}</div>`;
const stopPin = (i,act) => `<div class="pin-stop${act?' active':''}">${i+1}</div>`;
// เส้นทางตามแผน (เปิด/ปิด จำค่าในเครื่อง) + แสดงเฉพาะช่วงจุดที่เลือก
let mapRoute = load('jt.mapRoute', true);
function planRange(d){ const r=S.rng; return r && r.day===S.day && r.trip===curTrip && r.b<d.stops.length ? r : null; }
const inRange = (r,i) => !r || (i>=r.a && i<=r.b);
const inPlanIds = d => new Set(d.stops.map(s=>s.poi).concat(d.alts.map(s=>s.poi)).filter(Boolean));
function renderMapPlan(d){
  const r=planRange(d);
  $('#mapPlan').innerHTML = `<button class="chip" type="button" id="mpRoute" aria-pressed="${mapRoute}">${mi('route')}${__('เส้นทาง')}${mapRoute?'':' '+__('(ปิด)')+''}</button>
    <button class="chip" type="button" id="mpRange" aria-pressed="${!!r}">${mi('tune')}${r?`${__('จุดที่')} ${r.a+1}–${r.b+1}`:__('ทุกจุด')}</button>`;
  $('#mpRoute').onclick=()=>{ mapRoute=!mapRoute; save('jt.mapRoute',mapRoute); renderMap(); };
  $('#mpRange').onclick=()=>{ const el=$('#mapRange'); el.hidden=!el.hidden; if(!el.hidden) renderRangePanel(d); };
}
function renderRangePanel(d){
  const r=planRange(d)||{a:0, b:Math.max(0,d.stops.length-1)}, el=$('#mapRange');
  if(!d.stops.length){ el.innerHTML='<p class="msg">'+__('วันนี้ยังไม่มีจุดในแผน')+'</p>'; return; }
  const opts=sel=>d.stops.map((s,i)=>`<option value="${i}"${i===sel?' selected':''}>${i+1} · ${esc(s.t)} ${esc(tp(s.n))}</option>`).join('');
  el.innerHTML=`<div class="field"><label for="rgA">${__('ตั้งแต่จุดที่')}</label><select id="rgA">${opts(r.a)}</select></div>
    <div class="field"><label for="rgB">${__('ถึงจุดที่')}</label><select id="rgB">${opts(r.b)}</select></div>
    <div class="ctrl"><button class="btn sm pri" type="button" id="rgOk">${__('แสดงช่วงนี้')}</button><button class="btn sm" type="button" id="rgAll">${__('แสดงทุกจุด')}</button></div>`;
  $('#rgOk').onclick=()=>{ let a=+$('#rgA').value, b=+$('#rgB').value; if(a>b) [a,b]=[b,a];
    S.rng={day:S.day, trip:curTrip, a, b}; el.hidden=true; renderMap(); fitRange(); };
  $('#rgAll').onclick=()=>{ S.rng=null; el.hidden=true; S.fitted=false; renderMap(); };
}
function fitRange(){ const d=curDay(), r=planRange(d); const pts=d.stops.filter((s,i)=>inRange(r,i)).map(s=>s.ll); if(!pts.length) return;
  if(useG()) gFit(pts); else if(map){ if(pts.length===1) map.setView(pts[0],16); else map.fitBounds(pts,MAP_PAD); } }
function routeSegs(d){ // เส้นเชื่อมจุดในแผน แยกตามโซน เฉพาะช่วงที่เลือก
  if(!mapRoute) return []; const r=planRange(d), out=[]; let seg=[], z=null;
  d.stops.forEach((s,i)=>{ if(!inRange(r,i)) return; if(s.z!==z){ if(seg.length>1) out.push(seg); seg=[]; z=s.z; } seg.push(s.ll); });
  if(seg.length>1) out.push(seg); return out; }
function renderMapChips(d){
  $('#mapCats').innerHTML = CAT_KEYS.map(k=>`<button class="chip" type="button" data-mc="${k}" aria-pressed="${S.mapCats.has(k)}"><i class="gi" style="--gc:${catGi(k)[1]}">${mi(catGi(k)[0])}</i>${CAT[k].label}</button>`).join('');
  renderMapPlan(d);
  const zs=[...new Set(d.stops.map(s=>s.z))].filter(z=>isTokyo() && ZONES[z]);
  $('#mapZones').innerHTML = zs.map(z=>`<button class="chip" type="button" data-zone="${z}">${ZONES[z]}</button>`).join('');
}
function renderMap(){
  if(!load('jt.hintMap',false)){ save('jt.hintMap',true); setTimeout(()=>toast(__('แตะค้างบนแผนที่เพื่อเพิ่มจุดในแผน')+(settings.gkey?' '+__('· แตะร้านบนแผนที่เพื่อใส่แผน')+'':'')),600); }
  renderMapChips(curDay());
  if(useG()){ $('#map').hidden=true; $('#gmap').hidden=false; gRender().then(()=>{ if(S.route) drawRoute(false); }); return; }
  $('#gmap').hidden=true; $('#map').hidden=false;
  if(!map) initMap(); if(!map) return; map.invalidateSize();
  const d=curDay(), act=activeIdx(d);
  lyStops.clearLayers(); lyPOI.clearLayers();
  const rg=planRange(d), used=inPlanIds(d), accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#2c4aa0';
  routeSegs(d).forEach(seg=>L.polyline(seg,{color:accent,weight:3,dashArray:'6 7',opacity:.75}).addTo(lyStops));
  d.stops.forEach((s,i)=>{ if(!inRange(rg,i)) return; const a=i===act; L.marker(s.ll,{zIndexOffset:1000, icon:L.divIcon({className:'',html:stopPin(i,a),iconSize:a?[30,30]:[24,24],iconAnchor:a?[15,15]:[12,12],popupAnchor:[0,-12]})})
    .bindPopup(()=>stopPopup(s,i)).addTo(lyStops); });
  tripPlaces().filter(p=>d.areas.includes(p.area) && S.mapCats.has(p.cat) && !used.has(p.id)).forEach(p=>{
    L.marker(p.ll,{icon:L.divIcon({className:'',html:poiPin(p),iconSize:[20,20],iconAnchor:[10,10],popupAnchor:[0,-10]})})
      .bindPopup(()=>poiPopup(p)).addTo(lyPOI); });
  d.alts.forEach(s=>{ L.marker(s.ll,{zIndexOffset:900, icon:L.divIcon({className:'',html:altPin(s),iconSize:[22,22],iconAnchor:[11,11],popupAnchor:[0,-10]})})
    .bindPopup(()=>altPopup(s)).addTo(lyStops); });
  if(!S.fitted && !S.route){ S.fitted=true; if(planRange(d)) fitRange(); else fitZone(act>=0 ? d.stops[act].z : d.zone); }
  drawMe(); if(S.route) drawRoute(false);
}
function fitZone(z){ const d=curDay(); let pts=d.stops.filter(s=>s.z===z).map(s=>s.ll);
  if(!pts.length) pts=d.stops.map(s=>s.ll);
  if(!pts.length){ const c = S.pos ? [S.pos.lat,S.pos.lng] : tripCenter(); // วันที่ยังไม่มีแผน: ไปที่ตำแหน่งฉัน หรือจุดกลางของทริป
    if(useG()){ if(gm){ gm.setCenter({lat:c[0],lng:c[1]}); gm.setZoom(S.pos?15:12); } } else if(map) map.setView(c, S.pos?15:12); return; }
  if(useG()){ gFit(pts); return; } if(!map) return;
  if(pts.length===1) map.setView(pts[0],15); else map.fitBounds(pts,MAP_PAD); }
$('#mapCats').addEventListener('click',e=>{ const b=e.target.closest('[data-mc]'); if(!b) return; const k=b.dataset.mc;
  S.mapCats.has(k) ? S.mapCats.delete(k) : S.mapCats.add(k); renderMap(); });
$('#mapZones').addEventListener('click',e=>{ const b=e.target.closest('[data-zone]'); if(b) fitZone(b.dataset.zone); });
$('#locate').addEventListener('click',()=>{ if(S.route) S.route.follow=true; if(S.watchId===null){ startGPS(); toast(__('กำลังหาตำแหน่ง…')); return; }
  if(!S.pos) return; if(useG()){ if(gm){ gm.setCenter({lat:S.pos.lat,lng:S.pos.lng}); gm.setZoom(16); } } else if(map) map.setView([S.pos.lat,S.pos.lng],16); });
function drawMe(center){
  if(useG()){ gDrawMe(center); return; }
  if(!map) return;
  [meM,meAcc,meRad].forEach(l=>l && map.removeLayer(l)); meM=meAcc=meRad=null;
  if(!S.pos) return; const ll=[S.pos.lat,S.pos.lng];
  meRad = L.circle(ll,{radius:500, color:'#2f7cf6', weight:1, dashArray:'4 6', fill:false, interactive:false}).addTo(map);
  meAcc = L.circle(ll,{radius:S.pos.acc, color:'#2f7cf6', weight:0, fillOpacity:.12, interactive:false}).addTo(map);
  meM = L.marker(ll,{zIndexOffset:2000, icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map);
  if(center && S.tab==='map') map.setView(ll,16);
}


/* ============ นำทางเดินในแอป (Google Routes API · ต้องมี Google Maps API Key ที่เปิด Routes API) ============
   ช่วงรถไฟยังเปิดแอป Google Maps เพราะ Google ไม่เปิดข้อมูลรถไฟญี่ปุ่นให้แอปอื่น */
const NAVT={}; let navSeq=0;
function navBtn(t, mode, cls){
  const href = t.url ? esc(t.url) : gDir(t.q||t.n||t.ll.join(','), mode, t.gid);
  if(mode!=='walking' || !settings.gkey) return `<a class="${cls}" target="_blank" rel="noopener" href="${href}">${__('นำทาง')}</a>`;
  const k='n'+(++navSeq); NAVT[k]={n:tp(t.n||t.name||''), ll:t.ll, gid:t.gid||'', href, thref:gDir(t.q||t.n||t.ll.join(','),'transit',t.gid)};
  if(navSeq>400) delete NAVT['n'+(navSeq-400)];
  return `<button class="${cls}" type="button" onclick="walkTo('${k}')">${__('นำทาง')}</button>`;
}
function decodePoly(str){ let i=0, lat=0, lng=0; const out=[];
  while(i<str.length){ for(const k of [0,1]){ let b, sh=0, r=0; do{ b=str.charCodeAt(i++)-63; r|=(b&31)<<sh; sh+=5; }while(b>=32);
      const d=(r&1)?~(r>>1):(r>>1); if(k===0) lat+=d; else lng+=d; } out.push([lat/1e5, lng/1e5]); }
  return out; }
let lyRoute=null, gmRoute=[];
async function walkTo(k){
  const t=NAVT[k]; if(!t) return;
  if(!S.pos){ if(S.watchId===null) startGPS(); toast(__('กำลังหาตำแหน่ง…')); for(let i=0;i<20 && !S.pos;i++) await new Promise(r=>setTimeout(r,500)); }
  if(!S.pos){ toast(__('หาตำแหน่งไม่ได้ เปิด Google Maps แทน')); window.open(t.href,'_blank'); return; }
  if(gmInfo) gmInfo.close(); if(map) map.closePopup();
  S.route={t, loading:true, follow:true}; go('map'); renderRoutePanel(); computeRoute();
}
async function computeRoute(){
  const r=S.route; if(!r || !S.pos) return; r.loading=true; r.at=Date.now(); renderRoutePanel();
  try{
    const res=await fetch('https://routes.googleapis.com/directions/v2:computeRoutes',{method:'POST',
      headers:{'Content-Type':'application/json','X-Goog-Api-Key':settings.gkey,
        'X-Goog-FieldMask':'routes.distanceMeters,routes.duration,routes.polyline.encodedPolyline,routes.legs.steps.distanceMeters,routes.legs.steps.navigationInstruction'},
      body:JSON.stringify({origin:{location:{latLng:{latitude:S.pos.lat, longitude:S.pos.lng}}},
        destination: r.t.gid ? {placeId:r.t.gid} : {location:{latLng:{latitude:r.t.ll[0], longitude:r.t.ll[1]}}},
        travelMode:'WALK', languageCode:LANG, units:'METRIC'})});
    const j=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(res.status===403 || (j.error && j.error.status==='PERMISSION_DENIED') ? 'perm' : 'fail');
    const rt=(j.routes||[])[0]; if(!rt || !rt.polyline) throw new Error('none');
    if(S.route!==r) return;
    r.pts=decodePoly(rt.polyline.encodedPolyline); r.total=rt.distanceMeters||0; r.secs=parseInt(rt.duration,10)||Math.round(r.total/1.25);
    r.cum=[0]; for(let i=1;i<r.pts.length;i++) r.cum.push(r.cum[i-1]+dist(r.pts[i-1],r.pts[i]));
    let c=0; r.steps=(((rt.legs||[])[0]||{}).steps||[]).map(x=>{ c+=x.distanceMeters||0; return {txt:(x.navigationInstruction||{}).instructions||'', m:x.distanceMeters||0, end:c}; }).filter(x=>x.txt);
    r.loading=false; r.err=''; r.arrived=false;
    drawRoute(true); updateRoute();
  }catch(e){ if(S.route!==r) return; r.loading=false;
    r.err = e.message==='perm' ? __('Key นี้ยังใช้หาเส้นทางไม่ได้: เปิด Routes API ใน Google Cloud และเพิ่ม Routes API ใน API restrictions ของ key')
      : e.message==='none' ? __('ไม่พบเส้นทางเดินไปจุดนี้') : __('คำนวณเส้นทางไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองใหม่');
    renderRoutePanel(); }
}
function routeProgress(){ const r=S.route, me=[S.pos.lat,S.pos.lng]; let bi=0, bd=Infinity;
  r.pts.forEach((p,i)=>{ const d=dist(me,p); if(d<bd){ bd=d; bi=i; } });
  const len=r.cum[r.cum.length-1]||1, rem=Math.max(0, r.total*(1-r.cum[bi]/len));
  return {off:bd, rem}; }
function updateRoute(){
  const r=S.route; if(!r || !r.pts || !S.pos) return;
  const pr=routeProgress(); r.rem=pr.rem;
  if(dist([S.pos.lat,S.pos.lng], r.pts[r.pts.length-1])<30 || pr.rem<25){ if(!r.arrived){ r.arrived=true; toast(''+__('ถึง')+' '+r.t.n+' '+__('แล้ว')+''); } }
  else if(pr.off>60 && S.pos.acc<60 && !r.loading && Date.now()-r.at>20000){ toast(__('ออกนอกเส้นทาง กำลังหาเส้นทางใหม่')); computeRoute(); return; }
  if(r.follow && S.tab==='map'){ if(useG()){ if(gm) gm.panTo({lat:S.pos.lat,lng:S.pos.lng}); } else if(map) map.panTo([S.pos.lat,S.pos.lng]); }
  renderRoutePanel();
}
function drawRoute(fit){
  const r=S.route; if(map && lyRoute){ map.removeLayer(lyRoute); lyRoute=null; } if(window.google && gmRoute.length) gClear(gmRoute);
  if(!r || !r.pts) return; const dest=r.pts[r.pts.length-1];
  if(useG()){ if(!gm || !window.google) return; const g=google.maps;
    gmRoute.push(new g.Polyline({map:gm, path:r.pts.map(p=>({lat:p[0],lng:p[1]})), strokeColor:'#2f7cf6', strokeOpacity:.9, strokeWeight:6, zIndex:40}));
    gmRoute.push(new g.marker.AdvancedMarkerElement({map:gm, position:{lat:dest[0],lng:dest[1]}, content:elOf('<div class="pin-dest"></div>'), zIndex:60}));
    if(fit) gFit(r.pts.concat([[S.pos.lat,S.pos.lng]]));
  } else if(map){
    lyRoute=L.layerGroup([L.polyline(r.pts,{color:'#2f7cf6',weight:6,opacity:.9}),
      L.marker(dest,{zIndexOffset:1500, icon:L.divIcon({className:'',html:'<div class="pin-dest"></div>',iconSize:[18,18],iconAnchor:[9,9]})})]).addTo(map);
    if(fit) map.fitBounds(r.pts.concat([[S.pos.lat,S.pos.lng]]),{padding:[40,40], maxZoom:17});
  }
}
function clearRoute(){ S.route=null; drawRoute(false); renderRoutePanel(); }
function renderRoutePanel(){
  const el=$('#routePanel'), r=S.route; $('#v-map').classList.toggle('routing', !!r);
  if(!r){ el.hidden=true; el.innerHTML=''; $('#locate').style.bottom=''; return; }
  el.hidden=false;
  const head=`<div class="rp-head"><div style="min-width:0"><span class="label">${__('เดินไป')}</span><div style="font-weight:600">${esc(r.t.n)}</div></div>
    <button class="btn sm ghost" type="button" onclick="clearRoute()" aria-label="${__('ปิดเส้นทาง')}">${__('ปิด')}</button></div>`;
  const gmaps=`<div class="links"><a class="btn sm" target="_blank" rel="noopener" href="${r.t.href}">${__('เปิดใน Google Maps')}</a></div>`;
  let body;
  if(r.err) body=`<p class="msg" style="color:var(--bad)">${esc(r.err)}</p>${gmaps}`;
  else if(r.loading && !r.pts) body=`<p class="msg">${__('กำลังหาเส้นทาง…')}</p>`;
  else {
    const rem = r.rem ?? r.total, mins=Math.max(1, Math.round(r.secs/60 * (r.total ? rem/r.total : 1)));
    const done = r.total-rem, ci = Math.max(0, r.steps.findIndex(x=>x.end > done+5));
    const cur = r.steps[ci];
    body = (r.arrived ? `<div class="rp-next">${__('ถึงปลายทางแล้ว')}</div>`
      : `<div class="rp-big">${fmtD(rem)} · ~${mins} ${__('นาที')}</div>${cur?`<div class="rp-next">${esc(cur.txt)}<small>${fmtD(Math.max(0,cur.end-done))}</small></div>`:''}`)
      + (r.total>3000 ? `<p class="msg">${__('ระยะเดินไกล อาจเร็วกว่าถ้านั่งรถไฟ ·')} <a target="_blank" rel="noopener" href="${r.t.thref}">${__('ดูเส้นทางรถไฟใน Google Maps')}</a></p>` : '')
      + (r.steps.length ? `<details><summary style="cursor:pointer;font-size:13px">${__('ขั้นตอนทั้งหมด (')}${r.steps.length})</summary><ol>${r.steps.map((x,i)=>`<li class="${i===ci && !r.arrived?'cur':''}">${esc(x.txt)} · ${fmtD(x.m)}</li>`).join('')}</ol></details>` : '')
      + gmaps;
  }
  const open = el.querySelector('details') && el.querySelector('details').open;
  el.innerHTML = head + body;
  if(open && el.querySelector('details')) el.querySelector('details').open=true;
  $('#locate').style.bottom = (el.offsetHeight + 12) + 'px';
}

/* ============ GOOGLE MAPS + PLACES (ใช้เมื่อมี API Key) ============ */
let gm=null, gmLoad=null, gmObjs=[], gmMe=[], gmInfo=null;
const useG = ()=> !!settings.gkey && (settings.mapSrc||'auto')==='auto' && !S.gFail;
function loadGoogle(){
  if(gmLoad) return gmLoad.p;
  const key=settings.gkey;
  const p=new Promise((res,rej)=>{
    window.__gmReady=()=>res(window.google);
    window.gm_authFailure=()=>{ S.gFail=true; S.gErr=__('Google Maps API Key ใช้ไม่ได้: ตรวจว่าเปิด Maps JavaScript API และ Places API (New) แล้ว และตั้งค่าจำกัดเว็บไซต์ให้ตรงกับลิงก์ของแอป');
      toast(__('Google Maps Key ใช้ไม่ได้ ใช้แผนที่ฟรีแทนชั่วคราว')); if(S.tab==='map') renderMap(); if(S.tab==='near') renderNear(); };
    const sc=document.createElement('script'); sc.async=true;
    sc.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(key)+'&v=weekly&libraries=marker,places&language='+LANG+'&region='+encodeURIComponent((T().region||'jp').toUpperCase())+'&loading=async&callback=__gmReady';
    sc.onerror=()=>rej(new Error('load')); document.head.appendChild(sc);
    setTimeout(()=>rej(new Error('timeout')),20000);
  });
  gmLoad={key,p,region:T().region||'jp'};
  p.catch(()=>{ S.gFail=true; S.gErr=__('โหลด Google Maps ไม่ได้ (ไม่มีเน็ตหรือถูกบล็อก)'); if(S.tab==='map') renderMap(); });
  return p;
}
const elOf = html=>{ const t=document.createElement('div'); t.innerHTML=html; return t.firstElementChild; };
function gClear(list){ list.forEach(o=>{ if('map' in o && typeof o.setMap!=='function') o.map=null; else o.setMap(null); }); list.length=0; }
async function gRender(){
  try{ await loadGoogle(); }catch(e){ return; }
  if(!useG()) return;
  const g=google.maps;
  if(!gm){
    gm=new g.Map($('#gmap'),{center:{lat:tripCenter()[0],lng:tripCenter()[1]}, zoom:12, mapId:'DEMO_MAP_ID', disableDefaultUI:true, gestureHandling:'greedy', clickableIcons:true,
      colorScheme: g.ColorScheme ? (settings.theme==='dark' ? g.ColorScheme.DARK : g.ColorScheme.LIGHT) : undefined});
    gmInfo=new g.InfoWindow();
    gm.addListener('dragstart', ()=>{ if(S.route) S.route.follow=false; });
    // แตะค้าง (มือถือ) / คลิกขวา → เพิ่มจุด · แตะร้าน/สถานที่ของ Google → ใส่แผน
    let pressT=null; const cancel=()=>{ clearTimeout(pressT); pressT=null; };
    gm.addListener('contextmenu', e=>{ cancel(); openMapAdd([+e.latLng.lat().toFixed(6), +e.latLng.lng().toFixed(6)]); });
    gm.addListener('mousedown', e=>{ cancel(); const ll=[+e.latLng.lat().toFixed(6), +e.latLng.lng().toFixed(6)]; pressT=setTimeout(()=>openMapAdd(ll), 650); });
    ['mouseup','dragstart','zoom_changed','click'].forEach(ev=>gm.addListener(ev, cancel));
    gm.addListener('click', e=>{ if(e.placeId){ e.stop(); openGPlace(e.placeId, e.latLng); } });
  }
  gClear(gmObjs);
  const d=curDay(), act=activeIdx(d);
  const accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#2c4aa0';
  const add=(ll,html,pop,z)=>{ const m=new g.marker.AdvancedMarkerElement({map:gm, position:{lat:ll[0],lng:ll[1]}, content:elOf(html), zIndex:z||1});
    m.addListener('click',()=>{ gmInfo.setContent(pop()); gmInfo.open({map:gm, anchor:m}); }); gmObjs.push(m); };
  const rg=planRange(d), used=inPlanIds(d);
  routeSegs(d).forEach(seg=>gmObjs.push(new g.Polyline({map:gm, path:seg.map(x=>({lat:x[0],lng:x[1]})), strokeOpacity:0,
      icons:[{icon:{path:'M 0,-1 0,1', strokeOpacity:.8, strokeColor:accent, scale:3}, offset:'0', repeat:'14px'}]})));
  tripPlaces().filter(p=>d.areas.includes(p.area) && S.mapCats.has(p.cat) && !used.has(p.id)).forEach(p=>add(p.ll,poiPin(p),()=>poiPopup(p),5));
  d.alts.forEach(s=>add(s.ll,altPin(s),()=>altPopup(s),8));
  d.stops.forEach((s,i)=>{ if(inRange(rg,i)) add(s.ll,stopPin(i,i===act),()=>stopPopup(s,i),i===act?12:10); });
  if(!S.fitted){ S.fitted=true; if(planRange(d)) fitRange(); else fitZone(act>=0 ? d.stops[act].z : d.zone); }
  gDrawMe();
}
async function openGPlace(pid, latLng){
  try{
    const {Place} = await google.maps.importLibrary('places');
    const pl = new Place({id:pid, requestedLanguage:LANG});
    await pl.fetchFields({fields:['displayName','location','types','googleMapsURI','rating','userRatingCount','formattedAddress']});
    const name = typeof pl.displayName==='string' ? pl.displayName : (pl.displayName && pl.displayName.text) || '';
    const o={ id:'g_'+pid, gid:pid, cat:catOfTypes(pl.types), name, ja:name, ll:[pl.location.lat(), pl.location.lng()], url:pl.googleMapsURI||'',
      note:[pl.rating?('★ '+pl.rating.toFixed(1)+(pl.userRatingCount?' ('+pl.userRatingCount.toLocaleString('en-US')+')':'')):'', pl.formattedAddress||''].filter(Boolean).join(' · ') };
    LIVE[o.id]=o; gmInfo.setContent(poiPopup(o)); gmInfo.setPosition(latLng); gmInfo.open({map:gm});
  }catch(err){ toast(__('อ่านข้อมูลสถานที่ไม่ได้ ตรวจว่าเปิด Places API (New) แล้ว')); }
}
function gFit(pts){ if(!gm || !pts.length) return;
  if(pts.length===1){ gm.setCenter({lat:pts[0][0],lng:pts[0][1]}); gm.setZoom(15); return; }
  const b=new google.maps.LatLngBounds(); pts.forEach(x=>b.extend({lat:x[0],lng:x[1]})); gm.fitBounds(b,{top:140,bottom:70,left:30,right:30});
  google.maps.event.addListenerOnce(gm,'idle',()=>{ if(gm.getZoom()>16) gm.setZoom(16); }); }
function gDrawMe(center){
  if(!gm || !window.google) return; gClear(gmMe); if(!S.pos) return;
  const g=google.maps, c={lat:S.pos.lat,lng:S.pos.lng};
  gmMe.push(new g.Circle({map:gm, center:c, radius:500, strokeColor:'#2f7cf6', strokeOpacity:.6, strokeWeight:1, fillOpacity:0, clickable:false}));
  gmMe.push(new g.Circle({map:gm, center:c, radius:S.pos.acc, strokeOpacity:0, fillColor:'#2f7cf6', fillOpacity:.12, clickable:false}));
  gmMe.push(new g.marker.AdvancedMarkerElement({map:gm, position:c, content:elOf('<div class="me"></div>'), zIndex:50}));
  if(center && S.tab==='map'){ gm.setCenter(c); gm.setZoom(16); }
}
