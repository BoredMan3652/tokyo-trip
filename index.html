const liveCache = {};
async function liveSearch(ll, gc, radius){
  const k=gc.k+'|'+ll[0].toFixed(4)+','+ll[1].toFixed(4)+'|'+radius;
  const c=liveCache[k]; if(c && Date.now()-c.t < 5*60000) return c.list;
  await loadGoogle();
  const {Place, SearchNearbyRankPreference} = await google.maps.importLibrary('places');
  const {places} = await Place.searchNearby({
    fields:['id','displayName','location','rating','userRatingCount','primaryTypeDisplayName','regularOpeningHours','utcOffsetMinutes','businessStatus','googleMapsURI','svgIconMaskURI','iconBackgroundColor'],
    locationRestriction:{center:{lat:ll[0],lng:ll[1]}, radius}, includedTypes:gc.types, maxResultCount:20,
    rankPreference: SearchNearbyRankPreference ? SearchNearbyRankPreference.DISTANCE : 'DISTANCE', language:LANG, region:T().region||'jp' });
  const list = await Promise.all((places||[]).map(async pl=>{
    let open=null; try{ open = await pl.isOpen(); }catch(e){}
    const name = typeof pl.displayName==='string' ? pl.displayName : (pl.displayName && pl.displayName.text) || '';
    const lat = typeof pl.location.lat==='function' ? pl.location.lat() : pl.location.lat, lng = typeof pl.location.lng==='function' ? pl.location.lng() : pl.location.lng;
    const type = typeof pl.primaryTypeDisplayName==='string' ? pl.primaryTypeDisplayName : (pl.primaryTypeDisplayName && pl.primaryTypeDisplayName.text) || '';
    const o={ id:'g_'+pl.id, gid:pl.id, cat:gc.c, name, ja:name, ll:[lat,lng], url:pl.googleMapsURI||'', open, closedForGood: pl.businessStatus==='CLOSED_PERMANENTLY',
      rating:pl.rating||0, nrating:pl.userRatingCount||0, type, mask:pl.svgIconMaskURI||'', bg:pl.iconBackgroundColor||'' };
    o.note=[o.rating?('★ '+o.rating.toFixed(1)+(o.nrating?' ('+o.nrating.toLocaleString('en-US')+' '+__('รีวิว)')+'':'')):''].filter(Boolean).join(' · ');
    LIVE[o.id]=o; return o; }));
  const fresh=list.filter(o=>!o.closedForGood);
  liveCache[k]={t:Date.now(), list:fresh}; return fresh;
}

const catOfTypes = types => { for(const k of CAT_KEYS){ if((types||[]).some(t=>GTYPES[k].includes(t))) return k; } return 'h'; };
async function textSearch(q){
  await loadGoogle();
  const {Place} = await google.maps.importLibrary('places');
  const d=curDay(); const c = S.pos ? [S.pos.lat,S.pos.lng] : (d.stops[0] ? d.stops[0].ll : tripCenter());
  const {places} = await Place.searchByText({ textQuery:q, fields:['id','displayName','location','formattedAddress','googleMapsURI','types','rating','userRatingCount'],
    locationBias:{center:{lat:c[0],lng:c[1]}, radius:50000}, maxResultCount:8, language:LANG, region:T().region||'jp' });
  return (places||[]).map(pl=>{
    const name = typeof pl.displayName==='string' ? pl.displayName : (pl.displayName && pl.displayName.text) || '';
    const lat = typeof pl.location.lat==='function' ? pl.location.lat() : pl.location.lat, lng = typeof pl.location.lng==='function' ? pl.location.lng() : pl.location.lng;
    const o={ id:'g_'+pl.id, gid:pl.id, cat:catOfTypes(pl.types), name, ja:name, ll:[lat,lng], url:pl.googleMapsURI||'',
      note:[pl.rating?('★ '+pl.rating.toFixed(1)):'' , pl.formattedAddress||''].filter(Boolean).join(' · ') };
    LIVE[o.id]=o; return o; });
}

/* ===== ลากเรียงลำดับ: เวลาของรายการที่ลาก = กึ่งกลางระหว่างรายการก่อนและหลังตำแหน่งใหม่ ===== */
const toMin = t => { const [h,m]=(t||'00:00').split(':').map(Number); return h*60+m; };
const fromMin = x => { x=Math.max(0, Math.min(23*60+59, Math.round(x))); return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0'); };
function dropTime(prev, next){
  if(prev && next) return fromMin((toMin(prev.t)+toMin(next.t))/2);
  if(next) return fromMin(toMin(next.t)-30);
  if(prev) return fromMin(toMin(prev.t)+30);
  return '10:00';
}
function moveStop(id, k){ // k = ตำแหน่งใหม่ในรายการที่เหลือ (ไม่นับตัวที่ลาก)
  if(locked(id)) return; const ep=editPlan(S.day); const i=ep.stops.findIndex(s=>s.id===id); if(i<0) return;
  const s=ep.stops.splice(i,1)[0]; const t=dropTime(ep.stops[k-1], ep.stops[k]); s.t=t; ep.stops.splice(k,0,s);
  sortStops(ep.stops); savePlan(); toast(''+__('ย้าย')+' "'+s.n+'" '+__('ไปเวลา')+' '+t); renderPlan(); }
function startDrag(e){
  const h=e.currentTarget, id=h.dataset.drag, li=h.closest('li'), list=[...$('#planPad').querySelectorAll('.timeline > li.stop')];
  const from=list.indexOf(li); if(from<0) return; e.preventDefault(); h.setPointerCapture(e.pointerId);
  const y0=e.clientY; let k=from; li.classList.add('dragging');
  const mids=list.map(x=>{ const r=x.getBoundingClientRect(); return r.top+r.height/2; });
  const mark=()=>{ list.forEach(x=>x.classList.remove('drop-before','drop-after')); if(k===from) return;
    if(k<from) list[k].classList.add('drop-before'); else list[k].classList.add('drop-after'); };
  const move=ev=>{ const dy=ev.clientY-y0; li.style.transform='translateY('+dy+'px)'; const y=ev.clientY; // ตำแหน่งวาง = ตำแหน่งนิ้ว
    k=from; for(let j=0;j<list.length;j++){ if(j<from && y<mids[j]){ k=j; break; } } for(let j=list.length-1;j>from;j--){ if(y>mids[j]){ k=j; break; } } mark(); };
  const end=()=>{ h.removeEventListener('pointermove',move); h.removeEventListener('pointerup',end); h.removeEventListener('pointercancel',end);
    li.style.transform=''; li.classList.remove('dragging'); list.forEach(x=>x.classList.remove('drop-before','drop-after'));
    if(k!==from) moveStop(id, k); };
  h.addEventListener('pointermove',move); h.addEventListener('pointerup',end); h.addEventListener('pointercancel',end);
}

function importBox(){

    <ol class="steps"><li>${__('กดปุ่มด้านบนเพื่อค้นใน Google Maps')}</li><li>${__('เลือกร้าน → กด')} <b>${__('แชร์')}</b> → <b>${__('คัดลอกลิงก์')}</b></li><li>${__('กลับมาที่แอปนี้ แล้ววางในช่องด้านล่าง')}</li></ol>
    <div class="amt" style="grid-template-columns:1fr auto"><textarea id="imp-t" rows="2" class="ein" style="margin:0" placeholder="${__('วางลิงก์หรือข้อความที่คัดลอกจาก Google Maps')}" aria-label="${__('ลิงก์ Google Maps')}">${esc(S.imp?S.imp.raw:'')}</textarea>
      <button class="btn" type="button" id="imp-paste">${__('วาง')}</button></div>
    <div id="imp-res">${S.imp ? importResult() : ''}</div></div>`;
}
function parseGmaps(text){
  const urlM = text.match(/https?:\/\/[^\s"'<>]+/); const url = urlM ? urlM[0] : '';
  const lines = text.split(/\n/).map(l=>l.trim()).filter(l=>l && !/https?:\/\//.test(l) && !/★|☆/.test(l));
  const dec = x=>{ try{ return decodeURIComponent(x.replace(/\+/g,' ')); }catch(e){ return x; } };
  let name = lines[0]||'', addr = lines[1]||'', ll=null;
  const m = url.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || url.match(/[?&](?:q|query|ll|center|destination)=(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(m) ll=[+m[1],+m[2]];
  const pm = url.match(/\/place\/([^/@?]+)/); if(!name && pm) name=dec(pm[1]);
  const qm = url.match(/[?&](?:q|query)=([^&]+)/); if(!name && qm && !/^-?\d+\.\d+,/.test(dec(qm[1]))) name=dec(qm[1]);
  return {url, name, addr, ll};
}
async function runImport(raw){
  raw=(raw||'').trim(); if(!raw){ S.imp=null; $('#imp-res').innerHTML=''; return; }
  if(S.imp && S.imp.raw===raw) return;   // ข้อความเดิม ไม่ต้องอ่านซ้ำ (กันปุ่มหายตอนกด)
  if(!/google\.|goo\.gl|g\.co\//.test(raw)){ S.imp={raw, err:__('ไม่ใช่ลิงก์ Google Maps ลองกด แชร์ → คัดลอกลิงก์ ในแอป Google Maps อีกครั้ง')}; $('#imp-res').innerHTML=importResult(); return; }
  const r=parseGmaps(raw); S.imp={raw, name:r.name, addr:r.addr, url:r.url, ll:r.ll, cat:S.ncat, loading:false};
  if((!r.ll || !r.name) && settings.url){
    S.imp.loading=true; $('#imp-res').innerHTML=importResult();
    try{ const res = await fetch(gsUrl('resolve')+'&u='+encodeURIComponent(r.url)+'&t='+encodeURIComponent([r.name,r.addr].filter(Boolean).join(' '))+'&r='+encodeURIComponent(T().region||'jp')); const j=await res.json();
      if(S.imp && S.imp.raw===raw){ if(j.ok){ if(!S.imp.name && j.name) S.imp.name=j.name; if(!S.imp.ll && j.lat!=null) S.imp.ll=[+j.lat,+j.lng]; if(j.url) S.imp.longUrl=j.url; } else S.imp.note2=j.error||''; }
    }catch(e){ if(S.imp) S.imp.note2=__('ติดต่อ Google Sheet ไม่ได้'); }
    if(S.imp) S.imp.loading=false;
  }
  if($('#imp-res')) $('#imp-res').innerHTML=importResult();
}
function importResult(){
  const m=S.imp; if(!m) return '';
  if(m.err) return `<p class="msg" style="color:var(--bad)">${esc(m.err)}</p>`;
  if(m.loading) return `<p class="msg">${__('กำลังอ่านชื่อร้านและพิกัดจากลิงก์…')}</p>`;

let settles = load('jt.settles', []);   // [{id,trip,from,to,amt(บาท),ts,synced,upd}]
let settleDel = load('jt.sdel', []);    // [{id,trip}] รอลบใน Sheet

const memName = id => (tripMembers().find(m=>m.id===id)||{}).name || __('สมาชิกที่ถูกลบ');
const SPLIT_MODES = [['none',__('ส่วนตัว')],['equal',__('หารเท่า')],['amount',__('กำหนดเอง')],['item',__('ตามรายการ')]];
const r2 = n => Math.round(n*100)/100;
// ส่วนของแต่ละคน (สกุลเงินของรายการ) · null = ยังไม่ระบุคนจ่าย (ไม่นับในเคลียร์เงิน)
function sharesOf(x){
  if(!x.payer) return null; const sp=x.split||{mode:'none'}, amt=+x.amount||0, o={};
  const add=(id,v)=>{ o[id]=(o[id]||0)+v; };
  if(sp.mode==='equal'){ const ids=(sp.among||[]).length ? sp.among : [x.payer]; ids.forEach(id=>add(id, amt/ids.length)); }
  else if(sp.mode==='amount'){ Object.keys(sp.amounts||{}).forEach(id=>{ const v=+sp.amounts[id]||0; if(v) add(id, v); }); }
  else if(sp.mode==='item'){ // ราคาแต่ละรายการหารคนที่กิน · ส่วนต่างจากยอดบิล (ภาษี/ค่าบริการ/ส่วนลด) แบ่งตามสัดส่วน
    const base={}; let sum=0;
    (sp.items||[]).forEach(it=>{ const who=(it.who||[]).length ? it.who : [x.payer]; const p=+it.p||0; sum+=p; who.forEach(id=>{ base[id]=(base[id]||0)+p/who.length; }); });
    if(sum>0) Object.keys(base).forEach(id=>add(id, base[id]*amt/sum)); else add(x.payer, amt); }
  else add(x.payer, amt);
  return o;
}
function splitLabel(x){ const sp=x.split||{mode:'none'};
  return sp.mode==='equal' ? ''+__('หาร')+' '+((sp.among||[]).length||1)+' '+__('คน')+'' : sp.mode==='amount' ? __('กำหนดยอดเอง') : sp.mode==='item' ? __('หารตามรายการ') : __('ส่วนตัว'); }
// ยอดสุทธิของแต่ละคนเป็นบาท: + = คนอื่นต้องคืนให้ · − = ต้องจ่ายคนอื่น
function balances(){
  const xs=expenses.filter(x=>expTrip(x)===curTrip), paid={}, own={}, sent={}, got={}; let unassigned=0;
  xs.forEach(x=>{ const sh=sharesOf(x); if(!sh){ unassigned++; return; } const thb=thbOf(x), k = +x.amount ? thb/(+x.amount) : 0;
    paid[x.payer]=(paid[x.payer]||0)+thb; Object.keys(sh).forEach(id=>{ own[id]=(own[id]||0)+sh[id]*k; }); });
  const st=settles.filter(s=>s.trip===curTrip);
  st.forEach(s=>{ sent[s.from]=(sent[s.from]||0)+s.amt; got[s.to]=(got[s.to]||0)+s.amt; });
  const ids=[...new Set(tripMembers().map(m=>m.id).concat(Object.keys(paid), Object.keys(own), Object.keys(sent), Object.keys(got)))];
  const rows=ids.map(id=>({id, paid:paid[id]||0, own:own[id]||0, sent:sent[id]||0, got:got[id]||0})).map(r=>Object.assign(r,{net:r.paid-r.own+r.sent-r.got}));
  return {rows, unassigned, st};
}
function transfers(rows){ // จับคู่คนที่ต้องจ่ายกับคนที่ต้องได้คืน ให้โอนน้อยครั้งที่สุดแบบง่าย
  const cr=[], db=[]; rows.forEach(r=>{ const v=r2(r.net); if(v>=0.5) cr.push([r.id,v]); else if(v<=-0.5) db.push([r.id,-v]); });
  cr.sort((a,b)=>b[1]-a[1]); db.sort((a,b)=>b[1]-a[1]); const out=[]; let i=0, j=0;
  while(i<db.length && j<cr.length){ const a=Math.min(db[i][1],cr[j][1]); out.push({from:db[i][0], to:cr[j][0], amt:r2(a)}); db[i][1]-=a; cr[j][1]-=a; if(db[i][1]<0.5) i++; if(cr[j][1]<0.5) j++; }
  return out;
}

function bindBud(){ const box=$('#budEd'); if(!box) return; const d=S.bd, upd=()=>{ $('#bd-sum').innerHTML=budSumTxt(); };
  box.onclick=e=>{ const b=e.target.closest('button'); if(!b) return; const v=b.dataset;
    if(v.bper){ d.per=v.bper; renderExp(); } else if(v.bby){ d.by=v.bby; renderExp(); } else if(v.bcur){ d.cur=v.bcur; renderExp(); }
    else if(v.bcdel!==undefined){ const c=d.cats.splice(+v.bcdel,1)[0]; delete d.cat[c[0]]; renderExp(); }
    else if(b.id==='bd-add'){ const i=$('#bd-new'), nm=i.value.trim(); if(!nm){ i.focus(); return; }
      if(d.cats.some(c=>c[1].trim()===nm)){ toast(__('มีหมวดชื่อนี้แล้ว')); return; }
      const at=d.cats.findIndex(c=>c[0]==='other'); d.cats.splice(at<0?d.cats.length:at, 0, ['c'+Date.now().toString(36), nm]); renderExp(); }
    else if(b.id==='bd-ok') saveBud(false); else if(b.id==='bd-clear') saveBud(true); else if(b.id==='bd-no'){ S.bd=null; renderExp(); } };
  box.querySelectorAll('[data-bcn]').forEach(i=>i.oninput=()=>{ d.cats[+i.dataset.bcn][1]=i.value; });
  box.querySelectorAll('[data-bca]').forEach(i=>i.oninput=()=>{ d.cat[d.cats[+i.dataset.bca][0]]=i.value; upd(); });
  const a=$('#bd-amt'); if(a) a.oninput=()=>{ d.amt=a.value; upd(); };

function saveBud(clear){
  const d=S.bd, tid=d.trip, names=d.cats.map(c=>c[1].trim());
  if(names.some(x=>!x)){ toast(__('ตั้งชื่อหมวดให้ครบ')); return; }
  if(new Set(names).size!==names.length){ toast(__('ชื่อหมวดซ้ำกัน')); return; }
  const cats=d.cats.map((c,i)=>[c[0], c[2]!==undefined && names[i]===__(c[2]) ? c[2] : names[i]]);
  const isDef = cats.length===EXC.length && cats.every((c,i)=>c[0]===EXC[i][0] && c[1]===EXC[i][1]);
  let bud=null;
  if(!clear){ const cat={}; if(d.by==='cat') d.cats.forEach(c=>{ const v=parseFloat(d.cat[c[0]]); if(v>0) cat[c[0]]=v; });
    const amt=parseFloat(d.amt)||0;
    if(d.by==='total' ? amt>0 : Object.keys(cat).length) bud={cur:d.cur, per:d.per, by:d.by, amt:d.by==='total'?amt:0, cat}; }
  // รายจ่ายของหมวดที่ถูกลบ → อื่นๆ · หมวดที่เปลี่ยนชื่อ → ส่งชื่อใหม่ขึ้น Sheet
  const old=catsOf(tid), keys=new Map(cats.map(c=>[c[0],c[1]])); let chx=false;
  expenses.forEach(x=>{ if(expTrip(x)!==tid) return; const k=catKey(x);
    if(!keys.has(k)){ x.cat='other'; x.synced=false; chx=true; }
    else if(lab(old,k)!==keys.get(k) || x.cat!==k){ x.cat=k; x.synced=false; chx=true; } });
  if(chx) save('jt.exp', expenses);
  tmeta[tid]=Object.assign({}, tmeta[tid]||{}, {cats:isDef?null:cats, bud, dirty:1}); saveMeta();
  S.bd=null; toast(clear ? __('ล้างงบแล้ว') : bud ? __('บันทึกงบแล้ว') : __('บันทึกหมวดหมู่แล้ว (ยังไม่ได้ตั้งงบ)'));
  renderExp(); renderStatus(); sync();
}

async function post(body){
  const r = await fetch(settings.url,{method:'POST', body:JSON.stringify(Object.assign({key:settings.key, codes, owner:devId},body))}); // text/plain → no CORS preflight
  const j = await r.json(); if(!j.ok){ const e=new Error(j.error||__('ผิดพลาด')); e.denied=!!j.denied; throw e; } return j;
}
// รายการที่รอส่งขึ้น Sheet (ทริป / แผน / สมาชิก)
const dirtyTrips = ()=> Object.values(trips).filter(t=>t.dirty);
const dirtyPlans = ()=>{ const out=[]; Object.keys(plans).forEach(tid=>{ if(!trips[tid]) return; Object.keys(plans[tid]).forEach(n=>{ const d=plans[tid][n]; if(d.dirty && +n<=trips[tid].ndays) out.push([tid,+n,d]); }); }); return out; };
const dirtyMembers = ()=>{ const out=[]; Object.keys(members).forEach(tid=>{ if(trips[tid]) members[tid].forEach(m=>{ if(m.dirty) out.push({trip:tid, id:m.id, name:m.name}); }); }); return out; };
const pendingShared = ()=> dirtyTrips().length + dirtyPlans().length + dirtyMeta().length + dirtyMembers().length + memberDel.length + planDrop.length
  + settles.filter(x=>!x.synced && trips[x.trip]).length + settleDel.length;
const planData = d => { const o=Object.assign({}, d); delete o.rev; delete o.dirty; delete o.mig; return JSON.stringify(o); };
async function sync(manual){
  if(!settings.url || S.syncing) { if(manual && !settings.url){ toast(__('ตั้งค่า URL ของ Google Sheet ก่อน')); go('set'); } return; }
  if(!navigator.onLine){ if(manual) toast(__('ออฟไลน์อยู่ จะซิงก์เมื่อมีเน็ต')); return; }
  const up = expenses.filter(x=>!x.synced);
  if(!up.length && !pendingDel.length && !locQ.length && !pendingShared()){ if(manual) toast(__('ข้อมูลตรงกับ Sheet แล้ว')); S.syncErr=''; renderStatus(); return; }
  S.syncing=true; S.syncErr=''; renderStatus();
  try{
    if(up.length){ await post({action:'upsert', items:up.map(x=>({id:x.id, ts:x.ts, day:x.day, amount:x.amount, cur:x.cur,
        thb:thbOf(x), cat:lab(catsOf(expTrip(x)),catKey(x)), pay:lab(PAY,x.pay), note:x.note, lat:x.lat, lng:x.lng, trip:expTrip(x), payer:x.payer||'', split:x.split||null}))});
      const ids=new Set(up.map(x=>x.id)); expenses.forEach(x=>{ if(ids.has(x.id)) x.synced=true; }); save('jt.exp',expenses); }
    if(pendingDel.length){ await post({action:'delete', ids:pendingDel}); pendingDel=[]; save('jt.del',pendingDel); }
    if(locQ.length){ const q=locQ.slice(); await post({action:'loc', items:q}); locQ=locQ.slice(q.length); save('jt.locq',locQ); }
    for(const t of dirtyTrips()){ const o=Object.assign({}, t); ['dirty','rev','pv','hidden','code','owned'].forEach(k=>delete o[k]);
      // เจ้าของ = เครื่องที่สร้างทริป · ทริปเก่า (โตเกียว) ยังไม่มีเจ้าของจนกว่าจะมีคนตั้งค่าซ่อน
      let j; try{ j=await post(Object.assign({action:'trip', trip:o, owner: t.ownerDev===devId ? devId : ''}, t.pv?{privacy:t.pv, owner:devId}:{})); }
      catch(e){ if(t.pv){ delete t.pv; saveTrips(); } throw e; }
      t.rev=j.rev; t.dirty=false; t.hidden=!!j.hidden; t.owned=!!j.owned; if(t.pv && j.hidden){ codes[t.id]=t.pv.code; save('jt.codes',codes); } delete t.pv; saveTrips(); }
    const dp=dirtyPlans();
    if(dp.length || planDrop.length){ const drop=planDrop.slice();
      const j=await post({action:'plan', items:dp.map(([tid,n,d])=>({trip:tid, day:n, title:d.title||'', data:planData(d)})), drop});
      dp.forEach(([tid,n,d])=>{ d.rev=j.rev; d.dirty=0; }); planDrop=planDrop.slice(drop.length); save('jt.pdrop',planDrop); savePlans(); }
    const dmt=dirtyMeta();
    if(dmt.length){ const j=await post({action:'plan', items:dmt.map(id=>({trip:id, day:0, title:'งบ + หมวดรายจ่าย', data:JSON.stringify({cats:tmeta[id].cats||null, bud:tmeta[id].bud||null})}))});
      dmt.forEach(id=>{ tmeta[id].rev=j.rev; tmeta[id].dirty=0; }); saveMeta(); }
    const dm=dirtyMembers();
    if(dm.length || memberDel.length){ const del=memberDel.slice();
      const j=await post({action:'member', items:dm, del});
      dm.forEach(x=>{ const m=(members[x.trip]||[]).find(y=>y.id===x.id); if(m){ m.dirty=false; m.rev=j.rev; } }); memberDel=memberDel.slice(del.length); saveMembers(); }
    const su=settles.filter(x=>!x.synced && trips[x.trip]);
    if(su.length || settleDel.length){ const del=settleDel.slice();
      await post({action:'settle', items:su.map(x=>({id:x.id, trip:x.trip, from:x.from, to:x.to, amt:x.amt, ts:x.ts})), del});
      su.forEach(x=>{ x.synced=true; }); settleDel=settleDel.slice(del.length); saveSettles(); }
    if(manual) toast(__('ซิงก์กับ Google Sheet แล้ว'));
  }catch(err){ S.syncErr=''+__('ซิงก์ไม่สำเร็จ:')+' '+(err.message||err)+' '+__('— ตรวจ URL / สิทธิ์')+' "'+__('ทุกคน')+'" '+__('ในการ Deploy')+''; if(manual) toast(__('ซิงก์ไม่สำเร็จ')); }
  S.syncing=false; renderStatus(); if(S.tab==='exp') renderExp();
}
// ดึงทริป + สมาชิก + แผนของทริปที่เปิดอยู่ จาก Sheet (คนอื่นแก้แล้วเห็นตาม)
async function pullShared(){
  if(!settings.url || !navigator.onLine) return;
  try{
    const r=await fetch(gsUrl('trips')); const j=await r.json(); if(!j.ok || !j.trips) throw new Error(j.error||'old');
    let chT=false;
    // ทริปที่ถูกซ่อนและเครื่องนี้ไม่มีรหัส → เอาออกจากเครื่อง (รวมรายการที่รอส่ง)
    (j.hidden||[]).forEach(id=>{ if(!trips[id]) return; delete trips[id]; delete plans[id]; delete members[id]; delete mine[id]; delete codes[id];
      memberDel=memberDel.filter(x=>x.trip!==id); planDrop=planDrop.filter(x=>x.trip!==id); locQ=locQ.filter(x=>x.trip!==id);

      window.expenses=expenses.filter(x=>expTrip(x)!==id); save('jt.exp',expenses); save('jt.pdrop',planDrop); save('jt.locq',locQ); save('jt.mine',mine); save('jt.codes',codes); savePlans(); saveMembers(); chT=true;
      if(S.joinTrip===id){ toast(__('รหัสเข้าร่วมทริปไม่ถูกต้อง หรือลิงก์หมดอายุ')); S.joinTrip=null; } });
    j.trips.forEach(rt=>{ if(rt.code && codes[rt.id]!==rt.code){ codes[rt.id]=rt.code; save('jt.codes',codes); } });
    { const rtk=j.trips.find(t=>t.id===DEF_TRIP), lt=trips[DEF_TRIP];
      if(lt && lt.seed==='tokyo'){
        if(rtk && rtk.seed===TOKYO_SEED){ // มีเครื่องอื่นอัปเดตแผน 9–13 พ.ย. ขึ้น Sheet แล้ว → ใช้ของใน Sheet
          Object.assign(lt, rtk, {dirty:false}); Object.values(plans[DEF_TRIP]||{}).forEach(d=>{ d.dirty=0; d.rev=0; delete d.mig; }); savePlans(); chT=true;
          if(curTrip===DEF_TRIP){ S.day=autoDay()||1; S.fitted=false; } }
        else if(migrateTokyoNov()) chT=true; } }
    j.trips.forEach(rt=>{ const lt=trips[rt.id]; if(lt && (lt.hidden!==rt.hidden || lt.owned!==rt.owned)){ lt.hidden=rt.hidden; lt.owned=rt.owned; chT=true; }
      if(!lt || (!lt.dirty && rt.rev>(lt.rev||0))){ const nd=rt.ndays; trips[rt.id]=Object.assign({}, lt||{}, rt, {dirty:false}); chT=true;
        if(lt && nd<lt.ndays && plans[rt.id]) Object.keys(plans[rt.id]).forEach(n=>{ if(+n>nd) delete plans[rt.id][n]; }); } });
    const remoteIds=new Set(j.trips.map(t=>t.id));
    Object.values(trips).forEach(t=>{ if(!remoteIds.has(t.id) && !t.dirty){ t.dirty=true; chT=true; } }); // ทริปที่ยังไม่มีใน Sheet (เช่นโตเกียวครั้งแรก) → ส่งขึ้น
    // สมาชิก: ใช้ของ Sheet เป็นหลัก ยกเว้นรายการที่แก้ในเครื่องแล้วยังไม่ได้ส่ง
    const byTrip={}; (j.members||[]).forEach(m=>{ (byTrip[m.trip]=byTrip[m.trip]||[]).push(m); });
    let chM=false;
    new Set(Object.keys(byTrip).concat(Object.keys(members))).forEach(tid=>{
      const loc=members[tid]||[], rem=byTrip[tid]||[]; const delIds=new Set(memberDel.filter(x=>x.trip===tid).map(x=>x.id));
      const out=rem.filter(m=>!delIds.has(m.id)).map(m=>{ const l=loc.find(x=>x.id===m.id); return l && l.dirty ? l : {id:m.id, name:m.name, rev:m.rev}; });
      loc.forEach(l=>{ if(l.dirty && !out.some(x=>x.id===l.id)) out.push(l); });
      if(JSON.stringify(out)!==JSON.stringify(loc)){ members[tid]=out; chM=true; } });
    if(chT) saveTrips(); if(chM) saveMembers();
    if(!trips[curTrip]){ curTrip = Object.keys(trips).find(id=>mine[id]) || Object.keys(trips)[0]; save('jt.trip',curTrip); S.day=autoDay()||1; S.fitted=false; }
    if(S.joinTrip && trips[S.joinTrip]){ const id=S.joinTrip; S.joinTrip=null; switchTrip(id); toast(''+__('เข้าร่วมทริป')+' "'+trips[id].name+'" '+__('แล้ว')+''); return; }
    const chP = await pullPlans(curTrip);
    S.sharedErr='';
    if(chT||chM||chP){ if(!(S.day>=1 && S.day<=T().ndays)) S.day=1; renderDays(); renderStatus();
      const typing = S.tab==='set' && $('#setPad').contains(document.activeElement);
      if(!typing && !(S.tab==='plan' && S.editMode)) renderTab(); }
    if(pendingShared()) sync();
  }catch(e){ S.sharedErr = e.message==='old' ? __('Code.gs ใน Sheet ยังเป็นเวอร์ชันเก่า ให้วางโค้ดใหม่แล้ว Deploy เป็นเวอร์ชันใหม่') : __('ดึงข้อมูลทริปไม่สำเร็จ'); }
}
async function pullPlans(tid){
  if(S.tab==='plan' && S.editMode && tid===curTrip) return false; // กำลังแก้แผนอยู่ ไม่ดึงทับ
  const r=await fetch(gsUrl('plans')+'&trip='+encodeURIComponent(tid)); const j=await r.json(); if(!j.ok || !j.plans) throw new Error(j.error||'old');
  const t=trips[tid]; let ch=false; const got=new Set();
  j.plans.forEach(rp=>{
    if(rp.day===0){ let d; try{ d=JSON.parse(rp.data); }catch(e){ return; } const m=tmeta[tid]; // แถววัน 0 = งบ + หมวดรายจ่าย
      if(!m || (!m.dirty && rp.rev>(m.rev||0))){ tmeta[tid]={cats:d.cats||null, bud:d.bud||null, rev:rp.rev}; saveMeta(); ch=true; } return; }
    if(rp.day<1 || rp.day>t.ndays) return; got.add(rp.day);
    let data; try{ data=JSON.parse(rp.data); }catch(e){ return; }
    const l=dayOf(tid, rp.day);
    if(l.mig){ // แผนเดิมในเครื่องนี้ (ก่อนอัปเดต): รวมกับของใน Sheet ไม่ทับกัน
      const ids=new Set(data.stops.map(s=>s.id)), aids=new Set((data.alts||[]).map(s=>s.id));
      data.stops=data.stops.concat(l.stops.filter(s=>!ids.has(s.id))); data.alts=(data.alts||[]).concat(l.alts.filter(s=>!aids.has(s.id)));
      sortStops(data.stops); plans[tid][rp.day]=Object.assign(data,{rev:rp.rev, dirty:1}); ch=true; }
    else if(!l.dirty && rp.rev>(l.rev||0)){ plans[tid][rp.day]=Object.assign(data,{rev:rp.rev}); ch=true; } });
  for(let n=1;n<=t.ndays;n++){ const l=dayOf(tid,n); if(l.mig){ delete l.mig; } if(!got.has(n) && !l.dirty && !l.rev){ l.dirty=1; ch=true; } } // วันที่ยังไม่มีใน Sheet → ส่งขึ้น
  if(ch) savePlans();
  return ch;
}
async function pull(silent){
  if(!settings.url){ if(!silent){ toast(__('ตั้งค่า URL ก่อน')); go('set'); } return; }
  try{ const r=await fetch(gsUrl()); const j=await r.json(); if(!j.ok) throw new Error(j.error);
    // รายการใหม่ → เพิ่ม · คนอื่นแก้ → อัปเดต · คนอื่นลบ → เอาออก (ยกเว้นรายการที่แก้ในเครื่องแล้วยังไม่ได้ส่ง)
    const remote=new Map(j.items.filter(it=>it.id).map(it=>[it.id,it])); let n=0, ch=0;
    const conv = it => ({id:it.id, trip:it.trip||DEF_TRIP, ts:it.ts||Date.now(), day:+it.day||1, amount:+it.amount, cur:it.cur||tripOf(it.trip||DEF_TRIP).cur, cat:(catsOf(it.trip||DEF_TRIP).find(c=>c[1]===it.cat||c[0]===it.cat)||[''])[0], catL:it.cat||'', pay:keyOf(PAY,it.pay),
      note:it.note||'', lat:it.lat||'', lng:it.lng||'', payer:it.payer||'', split:it.split||null, upd:it.upd||0, synced:true});
    const before=expenses.length; window.expenses=expenses.filter(x=>!x.synced || remote.has(x.id)); ch+=before-expenses.length;
    remote.forEach(it=>{ if(pendingDel.includes(it.id)) return; const loc=expenses.find(x=>x.id===it.id);
      if(!loc){ expenses.push(conv(it)); n++; }
      else if(loc.synced && (it.upd||0)>(loc.upd||0)){ Object.assign(loc, conv(it)); ch++; } });
    save('jt.exp',expenses); if(!silent || n) toast(n ? `${__('ดึงรายจ่ายจาก Sheet มา')} ${n} ${__('รายการ')}` : ch ? __('อัปเดตรายจ่ายจาก Sheet แล้ว') : __('ไม่มีรายการใหม่ใน Sheet'));
    await pullSettles();
    if(S.tab==='exp' && !(S.form && S.form.editId)) renderExp(); renderStatus();
  }catch(err){ if(!silent) toast(__('ดึงข้อมูลไม่สำเร็จ')); }
}
async function pullSettles(){
  const r=await fetch(gsUrl('settles')); const j=await r.json(); if(!j.ok || !j.items) return;
  const remote=new Map(j.items.map(it=>[it.id,it])); const dels=new Set(settleDel.map(x=>x.id));
  settles=settles.filter(x=>!x.synced || remote.has(x.id));
  remote.forEach(it=>{ if(dels.has(it.id)) return; const loc=settles.find(x=>x.id===it.id);
    if(!loc) settles.push(Object.assign({}, it, {synced:true})); else if(loc.synced && it.upd>(loc.upd||0)) Object.assign(loc, it, {synced:true}); });
  saveSettles();
}

// ค่าที่ใช้ร่วมกันทุกคน (เก็บในแท็บ Settings ของ Google Sheet) — ค่าอื่นเป็นของเครื่องใครเครื่องมัน
// วันเริ่ม/เรท/งบ ย้ายไปอยู่ในแต่ละทริปแล้ว (แท็บ Trips) — ค่าเดิมในแท็บ Settings ใช้ตั้งต้นทริปโตเกียวเท่านั้น
const GLOBAL_KEYS = ['logLoc','logMin','gkey'];
const LEGACY_KEYS = ['start','rate','budget'];
const GCONV = {start:v=>String(v||''), rate:v=>parseFloat(v)||0.22, budget:v=>parseFloat(v)||0, logLoc:v=>String(v)==='true', logMin:v=>parseInt(v,10)||10, gkey:v=>String(v||'').trim()};
function gsUrl(type){ const c=Object.keys(codes).map(k=>k+':'+codes[k]).join(',');
  return settings.url + (settings.url.includes('?')?'&':'?') + (type?'type='+type+'&':'') + 'key=' + encodeURIComponent(settings.key||'') + (c?'&c='+encodeURIComponent(c):''); }
function applyGlobal(o){
  let ch=false;
  const oldKey=settings.gkey;
  GLOBAL_KEYS.forEach(k=>{ if(o[k]===undefined || (o[k]==='' && k!=='gkey')) return; const v=GCONV[k](o[k]); if(settings[k]!==v){ settings[k]=v; ch=true; } });

    else if(b.hasAttribute('data-mdelno')){ S.memDel=null; R(); }
    else if(b.dataset.mdelyes){ const id=b.dataset.mdelyes; const m=tripMembers().find(x=>x.id===id); members[curTrip]=tripMembers().filter(x=>x.id!==id);
      if(m && m.rev) memberDel.push({trip:curTrip, id}); if(meMap[curTrip]===id){ delete meMap[curTrip]; save('jt.me',meMap); }
      S.memDel=null; saveMembers(); R(); renderStatus(); sync(); } };
  $('#m-me').onchange=e=>{ if(e.target.value) meMap[curTrip]=e.target.value; else delete meMap[curTrip]; save('jt.me',meMap); toast(__('บันทึกแล้ว')); };
}

function renderSet(){
  const code = $('#gsCode').textContent.trim();
  const box = 'class="card" style="display:flex;flex-direction:column;gap:12px"';

    <h2>${__('ตั้งค่า')}</h2>

    <div ${box}>
      <div class="planbar"><h3>${__('ตั้งค่ากลาง')}</h3><span class="tag on">${__('ทุกคนเห็นเหมือนกัน')}</span></div>
      <div class="switch"><div><b style="font-size:14px">${__('ส่งตำแหน่งลง Sheet')}</b><div class="hint" style="font-size:12px;color:var(--muted)">${__('ทุกเครื่องที่เปิดแอปอยู่จะส่งตำแหน่งลงแท็บ Locations')}</div></div><input id="s-log" type="checkbox" ${settings.logLoc?'checked':''}></div>

        <span class="hint">${__('ใส่แล้วแผนที่จะเป็น Google Maps แท็บรอบตัวค้นร้านแบบเรียลไทม์ได้ และปุ่ม')} "${__('นำทาง')}" ${__('(ทางเดิน) จะแสดงเส้นทางในแอป · เปิด Maps JavaScript API, Places API (New) และ Routes API ให้ key นี้ · Key เก็บใน Google Sheet ไม่อยู่ในไฟล์บน GitHub')}${S.gErr?`<br><b style="color:var(--bad)">${esc(S.gErr)}</b>`:''}</span></div>
      <p class="msg" id="g-msg"></p>
    </div>

    <div ${box}>
      <div class="planbar"><h3>${__('เชื่อม Google Sheet')}</h3><span class="tag">${__('เครื่องนี้')}</span></div>
      <div class="field"><label for="s-url">${__('Web app URL (ลงท้าย /exec)')}</label><input id="s-url" type="url" value="${esc(settings.url)}" placeholder="https://script.google.com/macros/s/…/exec"></div>
      <div class="field"><label for="s-key">${__('รหัสลับ (ถ้าตั้งใน SECRET)')}</label><input id="s-key" type="password" value="${esc(settings.key)}"></div>
      <div class="ctrl"><button class="btn pri" type="button" id="s-save">${__('บันทึกและเชื่อมต่อ')}</button><button class="btn" type="button" id="s-test">${__('ทดสอบการเชื่อมต่อ')}</button></div>
      <p class="msg" id="s-msg"></p>
      ${settings.url ? `<div class="field"><label for="s-inv">${__('ลิงก์เชิญเพื่อนร่วมทริป')}</label>
        <div class="amt" style="grid-template-columns:1fr auto"><input id="s-inv" type="text" readonly value="${esc(inviteLink())}"><button class="btn" type="button" id="s-invcopy">${__('คัดลอก')}</button></div>
        <span class="hint">${__('ส่งทาง LINE ให้เพื่อนเปิดครั้งเดียว แอปของเพื่อนจะเชื่อม Sheet เดียวกันเอง ไม่ต้องกรอก URL · ลิงก์นี้มีรหัสเข้า Sheet อย่าโพสต์สาธารณะ')}</span></div>` : ''}
      ${settings.url && settings.url===DEFAULT_SHEET_URL ? `<p class="sub">${__('✓ แอปนี้ฝัง URL ของ Sheet ไว้แล้ว ทุกคนที่เปิดแอปเชื่อมต่ออัตโนมัติ ไม่ต้องตั้งค่าหรือใช้ลิงก์เชิญ')}</p>`
        : settings.url ? `<div class="field"><label for="s-emb">${__('ฝัง URL นี้ในแอป (ทำครั้งเดียว)')}</label>
        <div class="inrow"><input id="s-emb" type="text" readonly value="${esc("const DEFAULT_SHEET_URL = '"+settings.url+"';")}"><button class="btn" type="button" id="s-embcopy">${__('คัดลอก')}</button></div>
        <span class="hint">${__('ใน index.html ค้นหาบรรทัด')} <b>const DEFAULT_SHEET_URL = '';</b> ${__('แล้ววางบรรทัดนี้แทน → push ขึ้น GitHub · หลังจากนั้นทุกคนเปิดแอปแล้วใช้ได้ทันที')}${settings.key?' '+__('· ถ้าฝังแล้ว รหัสลับ (SECRET) ไม่มีผลกันคนนอก ควรปล่อยว่าง')+'':''}</span></div>` : ''}
      <ol class="steps">
        <li>${__('สร้าง Google Sheet ใหม่ → เมนู')} <b>${__('ส่วนขยาย → Apps Script')}</b></li>
        <li>${__('ลบโค้ดเดิม วางโค้ดด้านล่าง แล้วกดบันทึก')}</li>
        <li><b>${__('ทำให้ใช้งานได้ → การทำให้ใช้งานได้รายการใหม่')}</b> ${__('→ ประเภท')} <b>${__('เว็บแอป')}</b> ${__('· ดำเนินการในฐานะ')} <b>${__('ฉัน')}</b> ${__('· ผู้มีสิทธิ์เข้าถึง')} <b>${__('ทุกคน')}</b></li>
        <li>${__('กดอนุญาตสิทธิ์ แล้วคัดลอก URL ที่ลงท้าย')} <b>/exec</b> ${__('มาวางด้านบน → บันทึกและเชื่อมต่อ')}</li>
        <li>${__('ถ้าเคย Deploy แล้ว: วางโค้ดใหม่ →')} <b>${__('ทำให้ใช้งานได้ → จัดการการทำให้ใช้งานได้ → แก้ไข → เวอร์ชันใหม่')}</b> ${__('(URL เดิม)')}</li>
        <li>${__('สแกนบิล (ไม่บังคับ): สร้าง API key ฟรีที่ Google AI Studio → ใน Apps Script กด')} <b>${__('ตั้งค่าโปรเจกต์ (รูปเฟือง) → Script Properties → เพิ่ม')}</b> ${__('ชื่อ')} <b>GEMINI_KEY</b> ${__('ใส่ key · key อยู่ใน Apps Script เท่านั้น ไม่อยู่ในแอปหรือ Sheet')}</li>
      </ol>
      <div class="ctrl" style="justify-content:space-between"><span class="label">Code.gs</span><button class="btn sm" type="button" id="s-copy">${__('คัดลอกโค้ด')}</button></div>
      <pre class="code" id="s-code">${esc(code)}</pre>
    </div>

    <div ${box}>
      <div class="planbar"><h3>${__('การแสดงผลในเครื่องนี้')}</h3><span class="tag">${__('เครื่องนี้')}</span></div>
      <div class="field"><label for="s-lang">ภาษา / Language</label><select id="s-lang"><option value="th"${LANG==='th'?' selected':''}>ไทย</option><option value="en"${LANG==='en'?' selected':''}>English</option></select></div>
      <div class="field"><label>${__('ธีม')}</label><div class="seg" role="group" aria-label="${__('ธีม')}" style="align-self:flex-start">
        <button type="button" data-theme-set="light" aria-pressed="${settings.theme!=='dark'}">${__('ขาว')}</button><button type="button" data-theme-set="dark" aria-pressed="${settings.theme==='dark'}">${__('ดำ')}</button></div></div>
      <div class="field"><label for="s-map">${__('แบบแผนที่')}</label><select id="s-map">
        <option value="auto" ${(settings.mapSrc||'auto')==='auto'?'selected':''}>${__('Google Maps (ถ้ามี Key) / Esri')}</option>
        <option value="esri" ${settings.mapSrc==='esri'?'selected':''}>${__('Esri Street Map (ฟรี ชื่อภาษาอังกฤษ)')}</option>
        <option value="osm" ${settings.mapSrc==='osm'?'selected':''}>${__('OpenStreetMap (ฟรี ชื่อภาษาญี่ปุ่น)')}</option></select>
        <span class="hint">${__('ถ้าแผนที่ไม่ขึ้น ลองสลับแบบ')}</span></div>
      <div class="switch"><div><b style="font-size:14px">${__('กันหน้าจอดับ')}</b><div class="hint" style="font-size:12px;color:var(--muted)">${__('เบราว์เซอร์หยุด GPS เมื่อจอดับ เปิดไว้ถ้าต้องการติดตามต่อเนื่อง (กินแบต)')}</div></div><input id="s-wake" type="checkbox" ${settings.wake?'checked':''}></div>
    </div>
    <p class="sub">${__('แผน รายจ่าย และการตั้งค่าเก็บในเครื่องก่อนเสมอ ออฟไลน์ก็ใช้ได้ แล้วจะซิงก์เมื่อมีเน็ต · พิกัดสถานที่เป็นค่าประมาณ ปุ่ม')} "${__('นำทาง')}" ${__('จะค้นชื่อจริงใน Google Maps')}</p>`;
  updateGlobalMsg();

  // ตั้งค่ากลาง → บันทึกในเครื่อง + ส่งขึ้น Sheet
  const saveGlobal=()=>{ const before=Object.fromEntries(GLOBAL_KEYS.map(k=>[k,settings[k]]));
    settings.logLoc=$('#s-log').checked; settings.logMin=+$('#s-min').value;
    save('jt.settings',settings); renderStatus();
    pushSettings(GLOBAL_KEYS.filter(k=>before[k]!==settings[k])); };
  ['s-log','s-min'].forEach(id=>$('#'+id).addEventListener('change',saveGlobal));
  $('#s-gkey').addEventListener('change',()=>{ const v=$('#s-gkey').value.trim(); if(v===settings.gkey) return; settings.gkey=v; save('jt.settings',settings); pushSettings(['gkey']); gkeyChanged(); });
  // เฉพาะเครื่อง
  const saveConn=()=>{ settings.url=$('#s-url').value.trim(); settings.key=$('#s-key').value; save('jt.settings',settings); renderStatus(); };
  ['s-url','s-key'].forEach(id=>$('#'+id).addEventListener('change',saveConn));
  $('#s-lang').onchange=e=>{ try{ localStorage.setItem('jt.lang', JSON.stringify(e.target.value)); }catch(err){} location.reload(); };
  $('#s-map').onchange=e=>{ settings.mapSrc=e.target.value; save('jt.settings',settings); tileIdx = settings.mapSrc==='osm'?1:0; tileTried=new Set(); if(map) setTiles(); S.fitted=false; toast(__('เปลี่ยนแบบแผนที่แล้ว')); };
  $('#setPad').querySelectorAll('[data-theme-set]').forEach(b=>b.onclick=()=>setTheme(b.dataset.themeSet));
  $('#s-wake').onchange=e=>{ settings.wake=e.target.checked; save('jt.settings',settings); keepAwake(settings.wake && S.watchId!==null); };
  $('#s-save').onclick=async()=>{ saveConn(); if(!settings.url){ toast(__('ใส่ URL ก่อน')); return; } toast(__('กำลังเชื่อมต่อ…')); S.globalLoaded=false; await pullSettings(); await pullShared(); sync(); pull(true); renderSet(); };
  $('#s-test').onclick=async()=>{ saveConn(); const m=$('#s-msg'); if(!settings.url){ m.textContent=__('ใส่ URL ก่อน'); return; } m.textContent=__('กำลังทดสอบ…');
    try{ const r=await fetch(gsUrl()); const j=await r.json();
      m.textContent = j.ok ? `${__('เชื่อมต่อสำเร็จ · ใน Sheet มีรายจ่าย')} ${j.items.length} ${__('รายการ')}` : ''+__('เชื่อมต่อได้แต่:')+' '+j.error; if(j.ok){ sync(); pullSettings(); pullShared(); } }
    catch(e){ m.textContent=''+__('เชื่อมต่อไม่ได้ ตรวจว่า URL ลงท้าย /exec และตั้งสิทธิ์')+' "'+__('ทุกคน')+'"'; } };
  $('#s-copy').onclick=()=>copyText(code, $('#s-code'));
  const ic=$('#s-invcopy'); if(ic) ic.onclick=()=>copyText(inviteLink(), $('#s-inv'));
  const ec=$('#s-embcopy'); if(ec) ec.onclick=()=>copyText($('#s-emb').value, $('#s-emb'));
}

/* ============ BOOT ============ */
// เปิดจากลิงก์เชิญ: #sheet=<url>&key=<รหัส> และ/หรือ #join=<tripId>&code=<รหัสเข้าร่วม>
(function(){ const h=location.hash.slice(1); if(!h.includes('sheet=') && !h.includes('join=')) return;
  const q=new URLSearchParams(h); const u=q.get('sheet'); if(u && /^https:\/\/script\.google\.com\//.test(u)){ settings.url=u; settings.key=q.get('key')||''; save('jt.settings',settings); setTimeout(()=>toast(__('เชื่อมต่อ Google Sheet ของทริปแล้ว')),300); }
  const j=q.get('join'); if(j && /^[\w-]{1,40}$/.test(j)){ if(q.get('code')){ codes[j]=q.get('code'); save('jt.codes',codes); } S.joinTrip=j; }
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} })();
if(!(S.day>=1 && S.day<=T().ndays)) S.day=1;
S.anchor = (plan(S.day).stops.find(s=>!s.mv)||{}).id || 'gps';
go(['map','plan','near','exp','set','trips'].includes(S.tab) ? S.tab : 'map');
renderDays(); renderStatus();
if(settings.gpsAuto) startGPS();
setInterval(()=>{ if(S.tab==='plan' && !S.editMode) renderPlan(); }, 60000);
sync(); pullSettings().then(pullShared); pull(true);
</script>
